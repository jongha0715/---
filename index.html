<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All thing</title>
<meta name="description" content="우리 반의 급식, 시간표, 수행평가·시험, 일정을 한 눈에">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f0de">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141416">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="All thing">
<meta name="mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap');
/* ===================== All thing — style.css ===================== */
:root{
  color-scheme: light;
  --bg: #f8f0de;
  --bg-alt: #f1e4c6;
  --surface: #fffcf5;
  --surface-2: #f2e6c8;
  --surface-3: #e9d9af;
  --border: rgba(80,64,20,.14);
  --border-strong: rgba(80,64,20,.26);
  --aqua: #838952;
  --aqua-deep: #6b7143;
  --aqua-dim: rgba(131,139,82,.16);
  --on-accent: #fffaf0;
  --warm: #b8752e;
  --danger: #c0392b;
  --danger-dim: rgba(192,57,43,.12);
  --text: #2a2a1d;
  --text-2: #6e6c56;
  --text-3: #96937a;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 12px 28px rgba(60,50,20,.1);
  --sidebar-w: 236px;
  --display-font: 'Black Han Sans', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --ease-smooth: cubic-bezier(.22,1,.36,1);
}
/* A genuinely designed dark palette — not an inversion. Giving the browser real dark-mode
   support here also stops force-dark heuristics (Samsung Internet etc.) from kicking in on
   their own, since they only override pages that DON'T declare their own dark theme. */
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg: #141416;
    --bg-alt: #1b1b1e;
    --surface: #202023;
    --surface-2: #29292d;
    --surface-3: #323236;
    --border: rgba(255,255,255,.09);
    --border-strong: rgba(255,255,255,.18);
    --aqua: #a8b273;
    --aqua-deep: #838952;
    --aqua-dim: rgba(168,178,115,.18);
    --on-accent: #17170e;
    --warm: #e0a355;
    --danger: #ff6b5b;
    --danger-dim: rgba(255,107,91,.15);
    --text: #f2ede0;
    --text-2: #aaa89a;
    --text-3: #7a7869;
    --shadow: 0 14px 32px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{ box-sizing: border-box; }
html,body{ height:100%; overscroll-behavior-x: none; }
body{ touch-action: pan-y; }
body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1,h2,h3,p{ margin:0; }
button, input, textarea{ font-family: inherit; color: inherit; }
button{ cursor:pointer; }
a{ color: var(--aqua); }
::selection{ background: var(--aqua-dim); color: var(--text); }
:focus-visible{ outline: 2px solid var(--aqua); outline-offset: 2px; border-radius: 6px; }

.text-2{ color: var(--text-2); font-size: 13.5px; line-height:1.5; }
.text-3{ color: var(--text-3); font-size: 13px; }
.text-3.small{ font-size: 12px; }

.ic{ width:18px; height:18px; flex:none; display:inline-block; vertical-align:-4px; }
.ic.sm{ width:14px; height:14px; vertical-align:-2px; }
.crown-ic{ color: var(--warm); width:15px; height:15px; vertical-align:-2px; }

/* ---------- buttons & inputs ---------- */
.btn{
  appearance:none; border:1px solid var(--border-strong); background: var(--surface-2);
  color: var(--text); border-radius: 12px; padding: 11px 16px; font-size: 14.5px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition: transform .12s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{ background: var(--surface-3); border-color: var(--border-strong); }
.btn:active{ transform: scale(.97); }
.btn-primary{
  background: linear-gradient(135deg, var(--aqua) 0%, var(--aqua-deep) 100%);
  color: var(--on-accent); border-color: transparent; box-shadow: 0 6px 16px rgba(131,139,82,.28);
}
.btn-primary:hover{ filter: brightness(1.06); }
.btn-ghost{ background: transparent; }
.btn-sm{ padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.btn-block{ width:100%; }
.logout-btn{ margin-top: 4px; color: var(--text-2); }

.icon-btn{
  width:36px; height:36px; border-radius: 10px; border:1px solid transparent; background: transparent;
  display:inline-flex; align-items:center; justify-content:center; color: var(--text-2);
  transition: background .15s ease, color .15s ease;
}
.icon-btn:hover{ background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover{ background: var(--danger-dim); color: var(--danger); }

.field{ display:block; margin: 12px 0; }
.field > span{ display:block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; font-weight:600; }
.field input, .field textarea{
  width:100%; background: var(--surface-2); border:1px solid var(--border); border-radius: 12px;
  padding: 11px 13px; font-size: 14.5px; color: var(--text); resize: vertical;
  transition: border-color .15s ease;
}
.field input:focus, .field textarea:focus{ border-color: var(--aqua); }
.field input::placeholder, .field textarea::placeholder{ color: var(--text-3); }
.inline-input{ display:flex; gap:8px; }
.inline-input input{ flex:1; min-width:0; }
.checkline{ display:flex; align-items:center; gap:8px; font-size:13.5px; color: var(--text-2); margin: 14px 0; user-select:none; }
.checkline input{ width:16px; height:16px; accent-color: var(--aqua); }

.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
.toggle-row-title{ font-weight:700; font-size:13.5px; margin-bottom:2px; }
.switch{
  width:46px; height:26px; border-radius:999px; background: var(--surface-3); border:1px solid var(--border);
  position:relative; flex:none; transition: background .2s ease, border-color .2s ease; padding:0;
}
.switch.on{ background: var(--aqua); border-color: var(--aqua); }
.switch-knob{
  position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25); transition: transform .2s ease;
}
.switch.on .switch-knob{ transform: translateX(20px); }

/* password show/hide */
.pw-field{ position:relative; }
.pw-field input{ padding-right: 42px; }
.pw-toggle{
  position:absolute; right:5px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:8px; border:none; background:transparent; color: var(--text-3);
  display:flex; align-items:center; justify-content:center; transition: background .15s ease, color .15s ease;
}
.pw-toggle:hover{ background: var(--surface-3); color: var(--text); }

/* ---------- cards / layout bits ---------- */
.card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.card h3{ font-size: 15px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom: 4px; }
.form-card h3{ margin-bottom: 6px; }
.form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top: 14px; }

.view-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 14px; flex-wrap: wrap; }
.view-header h2{ font-size: 19px; font-weight:800; display:flex; align-items:center; gap:9px; font-family: var(--display-font); letter-spacing:.2px; }
.footnote{ text-align:center; color: var(--text-3); font-size:12.5px; margin-top: 14px; }
.tt-caption{ margin: -4px 0 14px; }
.modal-hint{ margin-top: 14px; }

.badge{
  display:inline-flex; align-items:center; background: var(--aqua-dim); color: var(--aqua);
  border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight:700;
}
.badge-alt{ background: var(--surface-3); color: var(--text-2); }
.dday{
  display:inline-flex; align-items:center; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight:800;
  background: var(--aqua-dim); color: var(--aqua-deep);
}
.dday.sm{ padding: 2px 9px; font-size:11.5px; flex: none; }
.dday.dday-soon{ background: rgba(184,117,46,.16); color: var(--warm); }
.dday.dday-progress{ background: rgba(184,117,46,.16); color: var(--warm); }
.dday.dday-now{ background: var(--aqua); color: var(--on-accent); }
.dday.dday-past{ background: var(--surface-2); color: var(--text-3); }

.chip-wrap{ display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; }
.chip{
  background: var(--surface-3); border:1px solid var(--border-strong); color: var(--text);
  padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight:600;
}
.chip-select{ display:flex; flex-wrap:wrap; gap:7px; margin: 10px 0 14px; max-height: 150px; overflow-y:auto; padding: 2px; }
.chip-btn{
  background: var(--surface-2); border:1px solid var(--border); color: var(--text-2);
  padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight:600;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.chip-btn.active{ background: var(--aqua-dim); color: var(--aqua); border-color: var(--aqua); }

.mini-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.mini-row{ display:flex; align-items:center; gap:10px; font-size: 13.5px; }
.mini-p{ color: var(--aqua); font-weight:700; font-size:12.5px; flex:none; min-width: 46px; }

.split-cols{ display:grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items:start; }
.split-col{ min-width:0; }
.split-col-head{
  display:flex; align-items:center; gap:7px; font-size:14.5px; font-weight:800; margin: 0 0 12px;
  padding-bottom:10px; border-bottom:2px solid var(--aqua-dim); color: var(--text);
}
.split-col-head .ic{ width:17px; height:17px; color: var(--aqua); }
/* stack the two columns whenever the mobile/bottom-nav layout is in play (narrow screens,
   portrait tablets, or a manually forced mobile layout) */
@media (max-width: 879px){ .split-cols{ grid-template-columns: 1fr; gap: 10px; } }
html[data-layout="mobile"] .split-cols{ grid-template-columns: 1fr !important; gap: 10px !important; }
html[data-layout="pc"] .split-cols{ grid-template-columns: 1fr 1fr !important; gap: 22px !important; }

.seg-select{ display:flex; gap:8px; }
.seg-option{ flex:1; position:relative; }
.seg-option input{ position:absolute; opacity:0; pointer-events:none; }
.seg-option span{
  display:flex; align-items:center; justify-content:center; padding: 11px 10px; border-radius: 12px;
  background: var(--surface-2); border:1px solid var(--border); font-size:13.5px; font-weight:700;
  color: var(--text-2); transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.seg-option.active span, .seg-option input:checked + span{
  background: var(--aqua); border-color: var(--aqua); color: var(--on-accent);
}

.section-divider{
  display:flex; align-items:center; gap:10px; margin: 22px 2px 12px; font-size:12.5px; font-weight:800;
  color: var(--text-3); letter-spacing:.2px;
}
.section-divider::after{ content:''; flex:1; height:1px; background: var(--border); }
.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding: 46px 20px; color: var(--text-3); text-align:center;
}
.empty-state .ic{ width:30px; height:30px; opacity:.5; }
.empty-state p{ font-size: 14px; }

.banner{
  display:flex; align-items:center; gap:10px; background: var(--aqua-dim); border:1px solid rgba(131,139,82,.35);
  color: var(--aqua-deep); padding: 12px 14px; border-radius: 14px; font-size: 13.5px; margin-bottom: 14px;
}
.banner .ic{ color: var(--aqua-deep); }
.banner-link{ text-decoration: underline; cursor:pointer; }
.install-banner{ justify-content:space-between; flex-wrap:wrap; row-gap:8px; }
.install-banner span{ display:flex; align-items:center; gap:8px; flex:1; min-width:180px; }

/* ---------- list items (meals/exams/events/notices) ---------- */
.list{ display:flex; flex-direction:column; gap:10px; }
.list-item{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px;
  position:relative;
}
.list-item.past{ opacity:.5; }
.list-item-body{ flex:1; min-width:0; }
.list-item-actions{ display:flex; gap:4px; flex:none; }
.new-badge{
  position:absolute; top:-7px; right:12px; background:#FFF3C4; color:#9A7B00;
  font-size:10.5px; font-weight:800; letter-spacing:.3px; padding: 2px 9px; border-radius:999px;
  border:1px solid rgba(154,123,0,.18);
}
.row-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.row-date{ font-size:12.5px; color: var(--text-2); font-weight:700; }
.row-title{ font-size: 15px; font-weight:700; margin-bottom: 3px; }
.row-sub{ font-size: 13px; color: var(--text-2); }
.notice-content{ margin-top:6px; line-height:1.55; }

.expand-toggle{
  display:inline-flex; align-items:center; gap:3px; background:none; border:none; padding: 6px 0 0;
  color: var(--aqua-deep); font-size:12.5px; font-weight:700;
}
.expand-toggle .ic{ width:14px; height:14px; transition: transform .2s ease; }
.expand-toggle.open .ic{ transform: rotate(90deg); }
.expand-panel{ display:grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
.expand-panel.open{ grid-template-rows: 1fr; }
.expand-inner{ overflow:hidden; min-height:0; }
.exam-photo{ display:block; width:100%; border-radius:12px; border:1px solid var(--border); }
.exam-photo-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:8px; margin-top:10px; max-width:420px; }
.exam-photo-grid .exam-photo{ margin-top:0; aspect-ratio:1; object-fit:cover; }
.exam-photo-btn{ background:none; border:none; padding:0; cursor:zoom-in; display:block; border-radius:12px; }
.exam-photo-btn:hover .exam-photo{ opacity:.88; }

.lightbox-overlay{
  position:fixed; inset:0; background: rgba(10,8,4,.86); z-index: 200;
  display:flex; align-items:center; justify-content:center; padding: 40px 18px;
  animation: fadeInLightbox .18s ease;
}
@keyframes fadeInLightbox{ from{ opacity:0; } to{ opacity:1; } }
.lightbox-img{ max-width:100%; max-height:100%; border-radius:10px; box-shadow: 0 20px 50px rgba(0,0,0,.5); will-change: transform; touch-action: none; }
.lightbox-close{
  position:fixed; top: calc(16px + env(safe-area-inset-top)); right:16px; width:40px; height:40px; border-radius:50%;
  background: rgba(255,255,255,.14); border:none; color:#fff; display:flex; align-items:center; justify-content:center; z-index:201;
}
.lightbox-close .ic{ width:20px; height:20px; }
.lightbox-counter{
  position:fixed; top: calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  background: rgba(255,255,255,.14); color:#fff; font-size:12.5px; font-weight:700;
  padding: 7px 14px; border-radius:999px; z-index:201;
}
.lightbox-nav-btn{
  position:fixed; top:50%; transform: translateY(-50%); width:42px; height:42px; border-radius:50%;
  background: rgba(255,255,255,.14); border:none; color:#fff; display:flex; align-items:center; justify-content:center;
  z-index:201;
}
.lightbox-nav-btn .ic{ width:20px; height:20px; }
.lightbox-nav-btn.left{ left:12px; }
.lightbox-nav-btn.left .ic{ transform: rotate(180deg); }
.lightbox-nav-btn.right{ right:12px; }
.exam-link{
  display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12.5px; font-weight:600;
  color: var(--aqua-deep); word-break:break-all;
}
.exam-link .ic{ width:14px; height:14px; flex:none; }
.photo-preview{ margin-bottom:8px; }
.photo-preview img{ display:block; width:100%; max-width:220px; border-radius:10px; border:1px solid var(--border); margin-bottom:6px; }
.photo-remove{ margin:0 !important; }
.photo-grid{ display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0; }
.photo-thumb{ position:relative; width:76px; height:76px; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-thumb-remove{
  position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; border:none;
  background: rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; padding:0;
}
.photo-thumb-remove .ic{ width:12px; height:12px; }
.multitext-group{ display:flex; flex-direction:column; gap:8px; margin: 8px 0; }
.multitext-row{ display:flex; gap:8px; align-items:center; }
.multitext-row .multitext-input{
  flex:1; background: var(--surface-2); border:1px solid var(--border); border-radius: 12px;
  padding: 10px 12px; font-size: 13.5px; color: var(--text);
}
.multitext-row .multitext-input:focus{ border-color: var(--aqua); outline:none; }
.acct-edit{ margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }

/* meal category groups — higher-contrast chips so dishes stand out from the card */
.meal-group{ margin-bottom: 12px; }
.meal-group:last-child{ margin-bottom: 0; }
.meal-group-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.meal-group-label{
  font-size:11px; font-weight:800; color: var(--on-accent); background: var(--aqua);
  padding: 3px 10px; border-radius:999px; letter-spacing:.2px;
}
.meal-cal{ font-size:11px; color: var(--text-2); }

/* ---------- home ---------- */
.home-greeting h2{ font-size: 21px; font-weight:800; margin-bottom:3px; font-family: var(--display-font); letter-spacing:.2px; }
.home-greeting{ margin-bottom: 16px; }
.home-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.home-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
.link-btn{
  background:none; border:none; color: var(--aqua); font-size:12.5px; font-weight:700;
  display:flex; align-items:center; gap:2px; padding: 4px 2px;
}
.link-btn .ic{ width:14px; height:14px; }

/* ---------- profile ---------- */
.avatar{
  width:52px; height:52px; border-radius: 50%; background: linear-gradient(135deg, var(--aqua-dim), var(--surface-3));
  color: var(--aqua); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; flex:none;
  border: 1px solid var(--border-strong);
}
.avatar.sm{ width:34px; height:34px; font-size:14px; }
.profile-row{ display:flex; align-items:center; gap:12px; margin-bottom: 16px; }
.profile-name{ font-size:16px; font-weight:800; }
.profile-sub{ font-size:12.5px; color: var(--text-2); display:flex; align-items:center; gap:4px; margin-top:2px; }

/* ---------- timetable table ---------- */
.tt-wrap{ overflow-x:auto; padding: 10px; }
.tt-table{ width:100%; border-collapse: collapse; table-layout: fixed; }
.tt-table th, .tt-table td{
  padding: 8px 4px; text-align:center; font-size: 12.8px; border-bottom: 1px solid var(--border);
  white-space: pre-line; word-break: keep-all; line-height:1.3;
}
.tt-table thead th{ color: var(--aqua); font-weight:800; font-size:12.5px; border-bottom: 1px solid var(--border-strong); }
.tt-table tbody th{ color: var(--text-3); font-weight:700; width: 22px; }
.tt-table tbody tr:last-child td, .tt-table tbody tr:last-child th{ border-bottom:none; }
.tt-edit td{ padding:4px; }
.tt-edit textarea{
  width:100%; background: var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding: 7px 6px; font-size:12.5px; text-align:center; color:var(--text); resize:none;
  line-height:1.3; font-family:inherit;
}
.tt-edit-wrap{ margin: 4px 0 14px; }
.copy-box{ border-top:1px solid var(--border); margin-top: 14px; padding-top: 14px; }

/* ---------- modal ---------- */
.modal-overlay{
  position: fixed; inset:0; background: rgba(3,6,7,.66); backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center; z-index: 60; padding: 16px;
  animation: overlayIn .22s ease;
}
.modal{
  width:100%; max-width: 560px; max-height: 88vh; overflow-y:auto; background: var(--surface);
  border:1px solid var(--border-strong); border-radius: 20px; box-shadow: var(--shadow);
  animation: modalIn .32s var(--ease-smooth);
}
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 16px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2; }
.modal-head h3{ font-size:16px; font-weight:800; }
.modal-body{ padding: 16px 18px 20px; }
@keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes modalIn{ from{ opacity:0; transform: scale(.96) translateY(8px); } to{ opacity:1; transform: scale(1) translateY(0); } }

/* ---------- app shell ---------- */
#app{ min-height: 100vh; }
.shell{ display:flex; min-height:100vh; }
.sidebar{
  width: var(--sidebar-w); flex:none; border-right: 1px solid var(--border); background: var(--bg-alt);
  display:flex; flex-direction:column; padding: 18px 14px; position: sticky; top:0; height:100vh;
  position:relative; transition: padding .15s ease;
}
.sidebar-resize-handle{
  position:absolute; top:0; right:-4px; width:8px; height:100%; cursor:col-resize; z-index:6;
  background:transparent;
}
.sidebar-resize-handle::after{
  content:''; position:absolute; top:0; right:3px; width:2px; height:100%;
  background: transparent; transition: background .15s ease;
}
.sidebar-resize-handle:hover::after, .sidebar-resize-handle.dragging::after{ background: var(--aqua); }
.sidebar.collapsed{ padding-left:10px; padding-right:10px; }
.sidebar.collapsed .brand{ justify-content:center; padding-left:0; padding-right:0; }
.sidebar.collapsed .brand-word{ display:none; }
.sidebar.collapsed .side-link{ justify-content:center; padding:11px 8px; }
.sidebar.collapsed .side-link span.nav-label{ display:none; }
.sidebar.collapsed .side-user{ flex-direction:column; gap:8px; padding: 10px 0; }
.sidebar.collapsed .side-user-info{ display:none; }
.brand{ display:flex; align-items:center; gap:10px; padding: 6px 8px 20px; }
.brand-btn{ background:none; border:none; cursor:pointer; text-align:left; font:inherit; }
.brand-mark{
  width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex:none;
  border-radius:11px; overflow:hidden;
}
.brand-mark-img{ width:100%; height:100%; object-fit:cover; }
.brand-mark.sm{ width:36px; height:36px; border-radius:9px; }
.brand-word{ font-weight:800; font-size:16px; letter-spacing:.2px; font-family: var(--display-font); }
.brand-word.sm{ font-size:14px; }
.brand-word.brand-anim{ animation: brandMorph 1.3s var(--ease-smooth); }
@keyframes brandMorph{
  0%{ color: var(--text); }
  15%{ color: var(--text); }
  55%{ color: var(--aqua-deep); text-shadow: 0 0 12px rgba(131,139,82,.4); transform: scale(1.05); }
  100%{ color: var(--text); text-shadow: none; transform: scale(1); }
}
.side-nav{ display:flex; flex-direction:column; gap:3px; flex:1; }
.nav-icon-wrap{ position:relative; display:inline-flex; }
.nav-dot{
  position:absolute; top:-2px; right:-2px; width:8px; height:8px; border-radius:50%;
  background: var(--danger); border:1.5px solid var(--bg-alt);
}
.side-link .nav-dot{ border-color: var(--bg-alt); }
.side-link{
  display:flex; align-items:center; gap:11px; padding: 11px 12px; border-radius: 12px; border:none;
  background:transparent; color: var(--text-2); font-size:14px; font-weight:600; text-align:left;
  transition: background .16s ease, color .16s ease;
}
.side-link:hover{ background: var(--surface-2); color: var(--text); }
.side-link.active{ background: var(--aqua-dim); color: var(--aqua); }
.side-user{
  display:flex; align-items:center; gap:9px; padding: 10px; border-top:1px solid var(--border); margin-top: 10px;
}
.side-user-link{
  display:flex; align-items:center; gap:9px; flex:1; min-width:0; background:none; border:none;
  padding:0; text-align:left; border-radius:10px; transition: background .15s ease;
}
.side-user-link:hover{ background: var(--surface-2); }
.side-user-info{ flex:1; min-width:0; }
.side-user-name{ font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-user-id{ font-size:11.5px; color: var(--text-3); }

.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; }
.topbar{ display:none; }
.main-scroll{ flex:1; overflow-y:auto; scroll-behavior:smooth; }
.main-inner{ max-width: 880px; margin: 0 auto; padding: 16px 26px 60px; touch-action: pan-y; }
.main-inner.view-enter{ animation: viewEnter .34s var(--ease-smooth); }
.main-inner.enter-right{ animation: enterFromRight .3s var(--ease-smooth); }
.main-inner.enter-left{ animation: enterFromLeft .3s var(--ease-smooth); }
.bottom-nav-wrap{ display:none; position:relative; }
@keyframes viewEnter{ from{ opacity:0; transform: translateY(7px); } to{ opacity:1; transform: translateY(0); } }
@keyframes enterFromRight{ from{ opacity:0; transform: translateX(26px); } to{ opacity:1; transform: translateX(0); } }
@keyframes enterFromLeft{ from{ opacity:0; transform: translateX(-26px); } to{ opacity:1; transform: translateX(0); } }

/* ---------- toast ---------- */
.layout-fab{
  position:fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom));
  width:48px; height:48px; border-radius:50%; border:none; z-index: 80;
  background: linear-gradient(135deg, var(--aqua), var(--aqua-deep)); color: var(--on-accent);
  display:flex; align-items:center; justify-content:center; box-shadow: 0 8px 20px rgba(0,0,0,.28);
  transition: transform .15s ease;
}
.layout-fab:active{ transform: scale(.92); }
.layout-fab .ic{ width:21px; height:21px; }

.toast-host{ position: fixed; left:0; right:0; bottom: 18px; display:flex; justify-content:center; z-index: 90; pointer-events:none; padding: 0 16px; }
.toast{
  background: var(--surface-3); border:1px solid var(--border-strong); color: var(--text);
  padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight:600; box-shadow: var(--shadow);
  animation: toastIn .22s ease;
}
.toast.err{ background: var(--danger-dim); color: var(--danger); border-color: rgba(192,57,43,.35); }
@keyframes toastIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:translateY(0);} }

.boot{ min-height:100vh; display:flex; align-items:center; justify-content:center; color: var(--text-3); font-size:14px; }

/* ---------- login screen ---------- */
.login-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding: 150px 20px 40px; position:relative; overflow:hidden;
}
.blob{ position:absolute; border-radius:50%; filter: blur(60px); opacity:.16; pointer-events:none; }
.blob.b1{ width:380px; height:380px; background: var(--aqua); top:-120px; left:-100px; animation: floatA 14s ease-in-out infinite; }
.blob.b2{ width:300px; height:300px; background: var(--aqua-deep); bottom:-100px; right:-80px; animation: floatB 17s ease-in-out infinite; }
.blob.b3{ width:220px; height:220px; background: var(--aqua); top:40%; right:10%; opacity:.1; animation: floatA 20s ease-in-out infinite reverse; }
@keyframes floatA{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(30px,20px) scale(1.08);} }
@keyframes floatB{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-24px,-18px) scale(1.05);} }

.hero{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; z-index:2;
  width:100%; max-width:640px; padding:0 20px;
  transition: top .85s var(--ease-smooth);
}
.hero.compact{ top:62px; }
.hero-title{
  font-size: clamp(28px, 5.4vw, 42px); font-weight:800; line-height:1.25; letter-spacing:-.3px;
  font-family: var(--display-font);
  transition: font-size .85s var(--ease-smooth);
}
.hero.compact .hero-title{ font-size: 21px; }
.hero-sub{
  margin-top: 10px; color: var(--text-2); font-size: 14px;
  transition: opacity .5s ease, margin-top .5s ease, max-height .5s ease;
  max-height: 30px; opacity:1; overflow:hidden;
}
.hero.compact .hero-sub{ opacity:0; max-height:0; margin-top:0; }
.morph-word{
  display:inline-block; color: var(--text); font-weight:700; will-change: transform, color;
}
.morph-word.charge{ color: var(--aqua-deep); transition: color .9s ease; }
.morph-word.shake{ animation: wordShake .4s ease-in-out 2; }
.morph-word.pop{ animation: wordPop .5s cubic-bezier(.34,1.56,.64,1); }
.morph-word.morphed{
  font-weight:800;
  color: var(--aqua-deep);
  letter-spacing:.2px;
  font-family: var(--display-font);
}
@keyframes wordShake{
  0%,100%{ transform: translate(0,0) rotate(0); }
  20%{ transform: translate(-3px,1px) rotate(-2deg); }
  40%{ transform: translate(3px,-1px) rotate(2deg); }
  60%{ transform: translate(-2px,1px) rotate(-1.5deg); }
  80%{ transform: translate(2px,-1px) rotate(1.5deg); }
}
@keyframes wordPop{
  0%{ transform: scale(.7); }
  60%{ transform: scale(1.1); }
  100%{ transform: scale(1); }
}

.login-card{
  width:100%; max-width: 360px; background: var(--surface); border:1px solid var(--border);
  border-radius: 20px; padding: 24px 22px; box-shadow: var(--shadow); position:relative; z-index:1;
  opacity:1; transform: translateY(0); transition: opacity .55s ease .05s, transform .55s var(--ease-smooth) .05s;
}
.login-card.pending{ opacity:0; transform: translateY(14px); transition:none; }
.login-error{ color: var(--danger); font-size: 13px; margin: 8px 0 0; }
.hint{ font-size:12px; color: var(--text-3); margin-top:-4px; }
.hint b{ color: var(--text-2); }

/* confetti — lives in a fixed viewport-level layer so it never gets dragged along by the hero's own transform/position transitions */
.confetti-root{ position:fixed; inset:0; pointer-events:none; z-index:5; overflow:visible; }
.confetti-piece{
  position:absolute; width: var(--size); height: var(--size); left:0; top:0; border-radius:50%;
  animation-name: confettiBurst; animation-fill-mode: forwards; opacity:0;
}
.confetti-piece.bar{ border-radius:2px; height: calc(var(--size) * 2.4); }
@keyframes confettiBurst{
  0%{
    transform: translate(-50%,-50%) translate(0,0) rotate(0deg) scale(.5);
    opacity:0;
    animation-timing-function: cubic-bezier(.17,.84,.44,1);
  }
  8%{ opacity:1; transform: translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1); }
  42%{
    transform: translate(-50%,-50%) translate(var(--tx1),var(--ty1)) rotate(calc(var(--rot) * .55)) scale(1);
    opacity:1;
    animation-timing-function: cubic-bezier(.5,0,.85,.4);
  }
  80%{ opacity:1; }
  100%{
    transform: translate(-50%,-50%) translate(var(--tx2),var(--ty2)) rotate(var(--rot)) scale(.55);
    opacity:0;
  }
}

/* ---------- stock game ---------- */
.market-pill{ font-size:12px; font-weight:800; padding:5px 11px; border-radius:999px; }
.market-pill.open{ background: var(--aqua-dim); color: var(--aqua-deep); }
.market-pill.night{ background: var(--surface-3); color: var(--text-2); }
.holiday-badge{ background: rgba(229,72,77,.12); color:#e5484d; }
.market-pill.closed{ background: rgba(184,117,46,.16); color: var(--warm); }
.wallet-card{ padding:16px 18px; }
.wallet-total{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.wallet-total b{ font-size:24px; font-weight:800; letter-spacing:-.3px; }
.wallet-split{ display:flex; gap:28px; margin-top:10px; }
.wallet-split div{ display:flex; flex-direction:column; gap:2px; }
.wallet-split b{ font-size:15px; }
.wallet-note{ margin-top:10px; }
.pl{ font-size:12.5px; font-weight:800; }
.up{ color:#e5484d; } .down{ color:#3b82f6; } .flat{ color: var(--text-3); }
.game-tabs{ display:flex; gap:6px; margin: 4px 0 14px; overflow-x:auto; scrollbar-width:none; }
.game-tabs::-webkit-scrollbar{ display:none; }
.game-tab{ flex:none; border:1px solid var(--border); background: var(--surface); color: var(--text-2); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; }
.game-tab.active{ background: var(--aqua); border-color: var(--aqua); color: var(--on-accent); }
.stock-card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); padding:14px 16px; }
.stock-top{ display:flex; justify-content:space-between; gap:12px; align-items:center; }
.stock-name{ font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.stock-price{ font-size:19px; font-weight:800; margin-top:3px; letter-spacing:-.2px; }
.stock-side{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none; }
.stock-chg{ font-size:12.5px; font-weight:800; }
.spark{ width:90px; height:28px; display:block; }
.stock-trade{ display:flex; align-items:center; gap:6px; margin-top:12px; flex-wrap:wrap; }
.stock-have{ display:block; margin-top:3px; }
.game-qty{ flex:1; min-width:56px; max-width:110px; background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 9px; font-size:14px; color: var(--text); }
.game-qty:focus{ border-color: var(--aqua); outline:none; }
.trade-buy, .trade-buy:hover{ background:#e5484d; color:#fff; border-color:transparent; }
.trade-sell, .trade-sell:hover{ background:#3b82f6; color:#fff; border-color:transparent; }
.trade-buy:hover:not(:disabled), .trade-sell:hover:not(:disabled){ filter: brightness(1.08); }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.mine-value{ margin-top:6px; font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; }
.item-actions{ display:flex; gap:8px; margin-top:10px; }
.hint-banner{ background: rgba(184,117,46,.14); border-color: rgba(184,117,46,.35); color: var(--warm); }
.hint-banner .ic{ color: var(--warm); }
.rank-row{ align-items:center; }
.rank-row.me{ border-color: var(--aqua); background: var(--aqua-dim); }
.rank-row.gold{ background: linear-gradient(135deg, #fff6c7, #ffe57a); border:2px solid #e8b400; color:#4a3a00; box-shadow: 0 6px 18px rgba(232,180,0,.28); }
.rank-row.silver{ background: linear-gradient(135deg, #eef8ff, #c9e8fb); border:2px solid #7cc4ef; color:#173a52; }
.rank-row.bronze{ background: linear-gradient(135deg, #fff1e3, #ffd2a6); border:2px solid #e8893a; color:#4f2a08; }
.rank-row.gold .rank-no, .rank-row.silver .rank-no, .rank-row.bronze .rank-no{ font-size:20px; }
.rank-row.gold .rank-total, .rank-row.silver .rank-total, .rank-row.bronze .rank-total{ color: inherit; }
.flow-line{ margin-top:8px; font-size:12px; font-weight:700; }
.flow-line.up{ color:#e5484d; } .flow-line.down{ color:#3b82f6; } .flow-line.flat{ color: var(--text-3); font-weight:600; }
.mine-summary{ padding:14px 16px; display:flex; flex-direction:column; gap:4px; }
.mine-flow{ font-size:15px; font-weight:700; }
.mine-flow b{ font-size:19px; font-weight:800; }
.arrow{ color: var(--text-3); margin:0 2px; }
.news-item.past{ opacity:.6; }
.news-item.active{ border-color: #e8893a; }
.news-live{ background: rgba(232,137,58,.16); color:#d06f1f; }
.lotto-table{ display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-size:11.5px; color: var(--text-2); }
.lotto-result{ text-align:center; padding:18px 12px; border-radius:16px; margin-bottom:12px; animation: lottoPop .45s cubic-bezier(.34,1.56,.64,1); border:2px solid var(--border); background: var(--surface); }
.lotto-result.jackpot{ background: linear-gradient(135deg,#fff6c7,#ffd84d); border-color:#e8b400; color:#4a3a00; }
.lotto-result.big{ background: linear-gradient(135deg,#ffe9f0,#ffc2d4); border-color:#e8507a; color:#5a1026; }
.lotto-result.mid{ background: linear-gradient(135deg,#eef8ff,#c9e8fb); border-color:#7cc4ef; color:#173a52; }
.lotto-result.small{ background: var(--aqua-dim); border-color: var(--aqua); }
.lotto-label{ font-size:16px; font-weight:800; }
.lotto-amount{ font-size:24px; font-weight:800; margin-top:4px; }
@keyframes lottoPop{ from{ transform: scale(.8); opacity:0; } to{ transform: scale(1); opacity:1; } }
.rank-no{ width:28px; font-weight:800; color: var(--aqua-deep); flex:none; }
.rank-name{ flex:1; font-weight:700; }
.rank-total{ font-weight:800; }
.item-actions{ align-items:center; flex-wrap:wrap; }
.order-chip{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; padding:7px 10px; border-radius:10px; font-size:12.5px; font-weight:700; }
.order-chip.stop{ background: rgba(59,130,246,.10); color:#3b82f6; }
.order-chip.take{ background: rgba(229,72,77,.10); color:#e5484d; }
.order-chip .link-btn{ color: inherit; text-decoration: underline; }
.order-form{ margin-top:10px; padding:12px; border-radius:12px; background: var(--surface-2); }
.seg-mini{ display:flex; gap:6px; }
.seg-mini button{ flex:1; border:1px solid var(--border); background: var(--surface); color: var(--text-2); padding:8px 6px; border-radius:10px; font-size:12.5px; font-weight:700; }
.seg-mini button.active{ background: var(--aqua); border-color: var(--aqua); color: var(--on-accent); }
.order-row{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; color: var(--text-2); }
.order-input{ flex:1; min-width:0; background: var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-size:14px; color: var(--text); }
.order-input:focus{ border-color: var(--aqua); outline:none; }
.chart-toggle{ padding:4px 0 0; }
.chart-toggle .ic{ transform: rotate(90deg); }
.stock-chart{ margin-top:12px; padding:10px 10px 6px; border-radius:12px; background: var(--surface-2); }
.chart-head, .chart-foot{ display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color: var(--text-3); }
.chart-head b{ color: var(--text); font-weight:800; }
.chart-head span:last-child{ font-weight:800; }
.chart-foot{ margin-top:4px; }
.chart-svg{ width:100%; height:auto; display:block; margin-top:6px; color: var(--text-3); }
.stock-chart.up .chart-svg{ color:#e5484d; } .stock-chart.down .chart-svg{ color:#3b82f6; }
.chart-line{ fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.chart-area{ fill:currentColor; opacity:.12; }
.chart-base{ stroke: var(--border-strong); stroke-width:1; stroke-dasharray:3 4; }
.chart-now{ fill:currentColor; }
.news-mark{ stroke: var(--surface); stroke-width:1.6; }
.news-mark.up{ fill:#e5484d; } .news-mark.down{ fill:#3b82f6; }
.game-tab{ position:relative; }
.tab-dot{ position:absolute; top:4px; right:6px; width:7px; height:7px; border-radius:50%; background: var(--danger); }
.news-item.latest{ border-color: var(--aqua); }
.news-title{ font-size:15px; font-weight:800; margin: 2px 0 4px; }
.news-stocks{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.news-chip{ font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:999px; }
.news-chip.up{ background: rgba(229,72,77,.12); color:#e5484d; }
.news-chip.down{ background: rgba(59,130,246,.12); color:#3b82f6; }

/* ===================== responsive ===================== */
@media (max-width: 879px){
  .sidebar{ display:none; }
  .layout-fab{ bottom: calc(78px + env(safe-area-inset-bottom)); }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 12px 16px;
    border-bottom:1px solid var(--border); background: var(--bg-alt); position: sticky; top:0; z-index: 20;
  }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .topbar-avatar-btn, .topbar-icon-btn{ background:none; border:none; padding:2px; border-radius:50%; line-height:0; flex:none; }
  .topbar-icon-circle{
    width:34px; height:34px; border-radius:50%; background: var(--surface-2);
    display:flex; align-items:center; justify-content:center; color: var(--text-3);
    transition: background .15s ease, color .15s ease;
  }
  .topbar-icon-circle .ic{ width:18px; height:18px; }
  .topbar-avatar-btn.active .topbar-icon-circle{ color: var(--aqua-deep); background: var(--aqua-dim); }
  .main-col{ height:auto; min-height:100vh; }
  .main-scroll{ overflow-y:visible; }
  .main-inner{ padding: 14px 16px calc(94px + env(safe-area-inset-bottom)); }
  .tt-wrap{ padding: 8px 4px; }
  .tt-table th, .tt-table td{ padding: 7px 2px; font-size: 11px; }
  .tt-table thead th{ font-size: 10.5px; }
  .tt-table tbody th{ width: 16px; font-size: 11px; }
  .bottom-nav-wrap{
    display:block; position:fixed; left:0; right:0; bottom:0; z-index: 50; background: var(--bg-alt);
    border-top:1px solid var(--border);
  }
  .bottom-nav{
    display:flex; justify-content:space-evenly; overflow-x:auto; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-nav::-webkit-scrollbar{ display:none; }
  .bn-btn{
    flex: 0 0 auto; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color: var(--text-3); font-size: 10.5px; font-weight:700;
    padding: 6px 9px; border-radius: 10px; transition: color .16s ease;
  }
  .bn-btn.active{ color: var(--aqua-deep); }
  .edge-cap{
    position:absolute; top:0; bottom:0; width:26px; pointer-events:none;
    opacity:0; transition: opacity .2s ease;
  }
  .edge-cap.left{ left:0; background: linear-gradient(to right, var(--bg-alt), transparent); }
  .edge-cap.right{ right:0; background: linear-gradient(to left, var(--bg-alt), transparent); }
  .bottom-nav-wrap.at-start .edge-cap.left{ opacity:1; }
  .bottom-nav-wrap.at-end .edge-cap.right{ opacity:1; }
  .home-grid{ grid-template-columns: 1fr; }
  .login-screen{ padding-top: 134px; }
}
@media (min-width: 880px){
  .main-inner{ padding: 22px 40px 60px; }
}

/* ---------- manual layout override (rotate button) ----------
   Lets a person force PC-style (sidebar) or mobile-style (bottom nav) layout regardless of
   actual screen width — mainly for tablets, where the automatic width breakpoint doesn't

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad2(n){ return n < 10 ? '0'+n : ''+n; }

const WEEKDAY_KO = ['일','월','화','수','목','금','토'];
function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${m}월 ${d}일 (${WEEKDAY_KO[dt.getDay()]})`;
}
function dDayInfo(s, endS){
  if(!s) return {label:'', cls:''};
  const today = new Date(todayStr());
  const [y,m,d] = s.split('-').map(Number);
  const target = new Date(y, m-1, d);
  const diff = Math.round((target - today) / 86400000);
  if(endS && endS > s){
    const [ey,em,ed] = endS.split('-').map(Number);
    const end = new Date(ey, em-1, ed);
    if(today >= target && today <= end){
      const remain = Math.round((end - today) / 86400000);
      return {label: remain === 0 ? '오늘 종료' : '진행중', cls:'dday-progress'};
    }
  }
  if(diff === 0) return {label:'D-DAY', cls:'dday-now'};
  if(diff > 0) return {label:'D-'+diff, cls: diff <= 3 ? 'dday-soon' : 'dday-normal'};
  return {label:'종료', cls:'dday-past'};
}

/* ---------- storage wrapper ----------
   Two layers:
   1) localStorage — always available in a normal browser tab, synchronous, guarantees
      "my data survives a refresh/revisit on this computer" even if a shared backend
      isn't reachable.
   2) window.storage (when present) — best-effort shared/cross-device layer. Every write
      goes to localStorage first (so it can never be lost), then is also pushed to
      window.storage if available. Every read prefers window.storage's latest value
      (for cross-device sync) but always falls back to the local copy.
*/
const LS_PREFIX = 'allthing:';
function lsKey(key, shared){ return LS_PREFIX + (shared ? 'shared:' : 'own:') + key; }
function lsGet(key, shared, fallback){
  try{
    const raw = localStorage.getItem(lsKey(key, shared));
    if(raw == null) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function lsSet(key, shared, value){
  try{ localStorage.setItem(lsKey(key, shared), JSON.stringify(value)); return true; }
  catch(e){ return false; }
}
const storageOK = !!(window.storage && window.storage.get && window.storage.set);
async function sGet(key, shared, fallback){
  if(shared && firebaseReady && fbDb){
    try{
      const snap = await fbDb.ref('allthing/'+key).once('value');
      const val = snap.val();
      if(val !== null && val !== undefined){ lsSet(key, shared, val); return val; }
    }catch(e){ /* fall through */ }
  }
  if(storageOK){
    try{
      const r = await window.storage.get(key, shared);
      if(r && r.value !== undefined && r.value !== null){
        const val = JSON.parse(r.value);
        lsSet(key, shared, val); // keep a fresh local mirror
        return val;
      }
    }catch(e){ /* fall through to local copy */ }
  }
  return lsGet(key, shared, fallback);
}
async function sSet(key, value, shared){
  lsSet(key, shared, value); // guaranteed local save, always happens first
  if(shared && firebaseReady && fbDb){
    try{ await fbDb.ref('allthing/'+key).set(value); }catch(e){ /* still saved locally */ }
  }
  if(storageOK){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
    catch(e){ return false; }
  }
  return true;
}
async function sDel(key, shared){
  try{ localStorage.removeItem(lsKey(key, shared)); }catch(e){}
  if(storageOK){
    try{ await window.storage.delete(key, shared); return true; }catch(e){ return false; }
  }
  return true;
}
// remote-only read used by the sync poller: never falls back to the local mirror, and
// returns null (rather than a stale/default value) when the shared backend can't be reached,
// so a failed poll never looks like "everything got deleted".
async function sGetRemoteOnly(key, shared){
  if(!storageOK) return null;
  try{
    const r = await window.storage.get(key, shared);
    if(!r || r.value === undefined || r.value === null) return null;
    return JSON.parse(r.value);
  }catch(e){ return null; }
}

/* ---------- safe read-before-write for shared collections ----------
   Every shared key (exams, events, notices, meals, users, timetables) is a single JSON
   blob, not per-item rows, so any write replaces the WHOLE thing. If a device's `state`
   is even slightly behind (it missed a realtime update, was backgrounded, just reconnected
   after being offline), blindly writing that device's local copy back silently deletes
   whatever other devices added in the meantime — this is what was wiping out exams/accounts
   across devices. The fix: right before every write, re-fetch the current shared value fresh
   and apply just this one change to THAT, never to the local `state` copy.
*/
async function freshSharedValue(key, fallback){
  const result = await withTimeout(sGet(key, true, fallback), 4000, undefined);
  if(result !== undefined && result !== null) return result;
  const local = lsGet(key, true, fallback);
  return (local !== undefined && local !== null) ? local : fallback;
}
async function saveSectionItem(section, id, data){
  const cfg = SECTIONS[section];
  const fresh = await freshSharedValue(cfg.storageKey, []);
  const list = (Array.isArray(fresh) ? fresh : []).slice();
  const finalId = id || uid();
  if(id){
    const idx = list.findIndex(x => x.id === id);
    if(idx > -1) list[idx] = Object.assign({}, list[idx], data);
    else list.push(Object.assign({ id }, data)); // item vanished from the fresh copy — keep the edit instead of silently dropping it
  } else {
    const newItem = Object.assign({ id: finalId }, data);
    if(section === 'notices'){ newItem.date = todayStr(); newItem.author = me() ? me().displayName : ''; }
    list.push(newItem);
  }
  list.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  state[section] = list;
  await sSet(cfg.storageKey, list, true);
  return { list, id: finalId };
}
/* ---------- exam photos: stored OUTSIDE the live-synced exams list ----------
   Photos used to live inline in the 'allthing-exams' blob, which is kept updated on every
   connected device via a live Firebase listener. Since that listener re-downloads the WHOLE
   blob on any change, embedding several ~1MB photos in it meant every single edit by anyone
   re-transmitted every photo to every connected device — this is almost certainly what burned
   through the Firebase free-tier bandwidth. Photos now live in their own key, fetched only
   when someone actually opens them, never pushed automatically to everyone.
*/
async function savePhotosForItem(itemId, photos){
  const key = 'allthing-exam-photos';
  const fresh = await freshSharedValue(key, {});
  const map = (fresh && typeof fresh === 'object') ? Object.assign({}, fresh) : {};
  if(photos && photos.length) map[itemId] = photos;
  else delete map[itemId];
  await sSet(key, map, true);
  state.examPhotosCache = state.examPhotosCache || {};
  state.examPhotosCache[itemId] = photos || [];
}
// How many photos an item has, whichever storage scheme it was saved under.
function examPhotoCount(item){
  if(!item) return 0;
  if(typeof item.photoCount === 'number') return item.photoCount;
  if(Array.isArray(item.photos)) return item.photos.length;
  return item.photo ? 1 : 0;
}
// Items created before photos moved to their own key still carry them inline as `photos`
// (or a single `photo`). Fall back to those so older entries keep working untouched.
function legacyInlinePhotos(itemId){
  const item = state.exams.find(x => x.id === itemId);
  if(!item) return [];
  if(Array.isArray(item.photos) && item.photos.length) return item.photos;
  if(item.photo) return [item.photo];
  return [];
}
async function loadPhotosForItem(itemId){
  state.examPhotosCache = state.examPhotosCache || {};
  if(state.examPhotosCache[itemId]) return state.examPhotosCache[itemId];
  const inline = legacyInlinePhotos(itemId);
  if(inline.length){
    state.examPhotosCache[itemId] = inline;
    return inline;
  }
  const fresh = await freshSharedValue('allthing-exam-photos', {});
  const photos = (fresh && fresh[itemId]) ? fresh[itemId] : [];
  state.examPhotosCache[itemId] = photos;
  return photos;
}
async function deletePhotosForItem(itemId){
  const key = 'allthing-exam-photos';
  const fresh = await freshSharedValue(key, {});
  const map = (fresh && typeof fresh === 'object') ? Object.assign({}, fresh) : {};
  if(map[itemId]){
    delete map[itemId];
    await sSet(key, map, true);
  }
  if(state.examPhotosCache) delete state.examPhotosCache[itemId];
}
async function deleteSectionItemSafe(section, id){
  const cfg = SECTIONS[section];
  const fresh = await freshSharedValue(cfg.storageKey, []);
  const list = (Array.isArray(fresh) ? fresh : []).filter(x => x.id !== id);
  state[section] = list;
  await sSet(cfg.storageKey, list, true);
  if(section === 'exams'){ await deletePhotosForItem(id); }
}
/* ---------- accounts & timetables: confirmed, per-entry writes ----------
   This is what was resetting accounts. Two things combined:
   1) A device that couldn't actually read the server (offline, a hung Firebase read, blocked
      rules, freshly cleared site data) fell back to the built-in default accounts — and then
      WROTE those defaults back to the server, wiping every real nickname/password.
   2) Every account change re-uploaded the ENTIRE accounts list from this device's copy, so a
      device with a stale copy silently reverted everyone else's changes.
   Fix: (a) a device never writes accounts/timetables until it has positively confirmed the
   server's current data, and (b) each change only touches the specific account/field it's
   about (Firebase multi-path update), so it can't clobber anyone else's entry.
*/
async function fbReadStrict(key, ms){
  // tri-state: {ok:true,val} = server answered (val may be null = genuinely empty),
  // {ok:false} = couldn't reach/read the server. Never confuses the two.
  if(!(firebaseReady && fbDb)) return { ok:false };
  const res = await withTimeout(
    fbDb.ref('allthing/'+key).once('value').then(snap => ({ ok:true, val: snap.val() })),
    ms || 5000,
    { ok:false }
  );
  return res || { ok:false };
}
function applyPathChanges(base, changes){
  const out = Object.assign({}, base || {});
  Object.keys(changes).forEach(p => {
    const slash = p.indexOf('/');
    const v = changes[p];
    if(slash === -1){
      if(v === null) delete out[p]; else out[p] = v;
    } else {
      const id = p.slice(0, slash), field = p.slice(slash+1);
      const rec = Object.assign({}, out[id] || {});
      if(v === null) delete rec[field]; else rec[field] = v;
      out[id] = rec;
    }
  });
  return out;
}
async function ensureConfirmed(key, flag){
  if(!(firebaseReady && fbDb) || state[flag]) return true;
  const r = await fbReadStrict(key, 6000);
  if(!r.ok){
    showToast('서버와 연결이 확인되지 않아 저장하지 않았어요. 잠시 후 다시 시도해주세요.', 'err');
    return false;
  }
  state[flag] = true;
  if(r.val){
    const sk = SYNC_KEY_MAP[key];
    state[sk] = r.val;
    lsSet(key, true, r.val);
  }
  return true;
}
async function updateSharedEntries(key, flag, changes){
  if(!(await ensureConfirmed(key, flag))) throw new Error('NOT_CONFIRMED');
  if(firebaseReady && fbDb){
    // permission errors reject quickly; a plain timeout means "queued, will sync when online"
    const res = await withTimeout(
      fbDb.ref('allthing/'+key).update(changes).then(() => 'ok', () => 'denied'),
      8000, 'queued'
    );
    if(res === 'denied'){
      showToast('서버가 저장을 거부했어요. 데이터베이스 규칙을 확인해주세요.', 'err');
      throw new Error('DENIED');
    }
  }
  const sk = SYNC_KEY_MAP[key];
  state[sk] = applyPathChanges(state[sk], changes);
  lsSet(key, true, state[sk]);
  if(!(firebaseReady && fbDb) && storageOK){
    try{ await window.storage.set(key, JSON.stringify(state[sk]), true); }catch(e){}
  }
  return state[sk];
}
function updateUsers(changes){ return updateSharedEntries('allthing-users', 'usersConfirmed', changes); }
function updateTimetables(changes){ return updateSharedEntries('allthing-timetables', 'timetablesConfirmed', changes); }

/* ---------- password hashing ----------
   Passwords used to sit in the database as plain text, readable by anyone who opened the
   database URL. Now they're stored only as a salted PBKDF2 hash. Older plain-text entries
   keep working and are upgraded to a hash automatically the next time that person logs in.
*/
function randomSalt(){
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pw, salt){
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash:'SHA-256' }, keyMat, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function verifyPassword(user, pw){
  if(!user) return false;
  if(user.pwHash && user.pwSalt){
    try{ return (await hashPassword(pw, user.pwSalt)) === user.pwHash; }catch(e){ return false; }
  }
  return user.password === pw;
}
async function passwordFieldChanges(id, pw, isDefault){
  const salt = randomSalt();
  const h = await hashPassword(pw, salt);
  return { [id+'/pwHash']: h, [id+'/pwSalt']: salt, [id+'/password']: null, [id+'/pwDefault']: !!isDefault };
}
async function passwordRecordFields(pw, isDefault){
  const salt = randomSalt();
  return { pwHash: await hashPassword(pw, salt), pwSalt: salt, pwDefault: !!isDefault };
}

/* ---------- constants ---------- */
const DAYS = ['월','화','수','목','금'];
const PERIODS = [1,2,3,4,5,6,7];

function classNameForId(id){

/* ---------- section config (meals / exams / events / notices share one CRUD engine) ---------- */
const SECTIONS = {
  meals: {
    label: '급식', icon: 'meal', storageKey: 'allthing-meals',
    emptyMsg: '아직 등록된 급식 정보가 없어요.', pastLabel: '지난 급식',
    fields: [

/* ---------- init ---------- */
function withTimeout(promise, ms, fallback){
  return new Promise((resolve) => {
    let settled = false;
    const timer = setTimeout(() => { if(!settled){ settled = true; resolve(fallback); } }, ms);
    promise.then((v) => { if(!settled){ settled = true; clearTimeout(timer); resolve(v); } })
           .catch(() => { if(!settled){ settled = true; clearTimeout(timer); resolve(fallback); } });
  });
}
/* ---------- notice notifications ----------
   Local-notification based (works while the browser/app is open or backgrounded on this
   device). True push-to-a-closed-app notifications would need a server component (Firebase
   Cloud Messaging + a paid Cloud Function trigger) — out of scope for a static file, so
   this covers "app open somewhere on this phone" rather than "phone fully closed".
*/
function notifEnabled(){
  return typeof Notification !== 'undefined' && Notification.permission === 'granted' && !!lsGet('notif-enabled', false, false);
}
async function toggleNotif(){
  if(typeof Notification === 'undefined'){ showToast('이 브라우저는 알림을 지원하지 않아요.', 'err'); return; }
  const currentlyOn = notifEnabled();
  if(currentlyOn){
    lsSet('notif-enabled', false, false);
    showToast('알림을 껐어요.');
    render();
    return;
  }
  if(Notification.permission === 'denied'){
    showToast('브라우저에서 알림이 차단되어 있어요. 브라우저 설정에서 허용해주세요.', 'err');
    return;
  }
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if(perm === 'granted'){
    lsSet('notif-enabled', false, true);
    seedSeenNotices();
    showToast('알림을 켰어요.');
  } else {
    showToast('알림 권한이 허용되지 않았어요.', 'err');
  }
  render();
}
function getSeenNoticeIds(){ return new Set(lsGet('seen-notice-ids', false, [])); }
function saveSeenNoticeIds(set){ lsSet('seen-notice-ids', false, Array.from(set)); }
function seedSeenNotices(){
  const seen = getSeenNoticeIds();
  state.notices.forEach(n => seen.add(n.id));
  saveSeenNoticeIds(seen);
}
function notifyNewNotices(){
  if(!notifEnabled()){ seedSeenNotices(); return; }
  const seen = getSeenNoticeIds();
  const newOnes = state.notices.filter(n => !seen.has(n.id));
  if(newOnes.length === 0) return;
  newOnes.forEach(n => { seen.add(n.id); showNoticeNotification(n); });
  saveSeenNoticeIds(seen);
}
function showNoticeNotification(notice){
  const title = '📢 All thing';
  const body = '새로운 공지가 등록되었습니다!';
  const fallback = () => { try{ new Notification(title, { body, icon:'icon-192.png' }); }catch(e){} };
  if(navigator.serviceWorker && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(reg => {
      if(reg && reg.showNotification){
        reg.showNotification(title, { body, icon:'icon-192.png', badge:'icon-192.png', tag:'notice-'+notice.id }).catch(fallback);
      } else fallback();
    }).catch(fallback);
  } else fallback();
}

/* ---------- notice read/unread tracking (drives the nav red-dot + NEW badges) ----------
   Deliberately separate from the "seen" set above: that one seeds on every app open (so we
   don't fire a notification burst for notices that already existed before this session).
   This one only updates when the person actually opens the 공지 tab, so the red dot/NEW
   badge correctly persists across app restarts until they've really looked.
*/
function getReadNoticeIds(){ return new Set(lsGet('read-notice-ids', false, [])); }
function saveReadNoticeIds(set){ lsSet('read-notice-ids', false, Array.from(set)); }
function markNoticesRead(){
  const read = getReadNoticeIds();
  state.notices.forEach(n => read.add(n.id));
  saveReadNoticeIds(read);
}
function hasUnreadNotices(){
  const read = getReadNoticeIds();
  return state.notices.some(n => !read.has(n.id));
}
function isNoticeUnread(id){
  return !!(state.noticesUnreadSnapshot && state.noticesUnreadSnapshot.has(id));
}

async function loadField(key, shared, fallback, ms){
  // sGet() already falls back through Firebase -> window.storage -> localStorage on its own,
  // but a *hung* read (typically Firebase's .once('value') waiting forever for a connection
  // that will never come while offline) never rejects, so a per-call timeout is needed too.
  // Racing that timeout to `undefined` — not the real fallback — is what matters: it lets us
  // tell "genuinely no data" apart from "the read never came back", so a hung read falls
  // through to the local mirror instead of being treated as if the data didn't exist.
  const result = await withTimeout(sGet(key, shared, fallback), ms, undefined);
  if(result !== undefined) return result;
  return lsGet(key, shared, fallback);
}
async function init(){
  let users, timetables, meals, exams, events, notices, session;
  try{
    const results = await Promise.all([
      fbReadStrict('allthing-users', 5000),
      loadField('allthing-timetables', true, {}, 4000),
      loadField('allthing-meals', true, [], 4000),
      loadField('allthing-exams', true, [], 4000),
      loadField('allthing-events', true, [], 4000),
      loadField('allthing-notices', true, [], 4000),
      loadField('allthing-session', false, null, 4000)
    ]);
    users = results[0]; timetables = results[1]; meals = results[2];
    exams = results[3]; events = results[4]; notices = results[5]; session = results[6];
    // users came back as a strict tri-state result — resolve it without ever guessing
    const ur = users;
    if(ur && ur.ok){
      state.usersConfirmed = true;
      if(ur.val){ users = ur.val; lsSet('allthing-users', true, users); }
      else {
        // server genuinely has no accounts yet (brand-new database): seed it once
        users = lsGet('allthing-users', true, null) || defaultUsers();
        try{ fbDb.ref('allthing/allthing-users').set(users).catch(()=>{}); }catch(e){}
        lsSet('allthing-users', true, users);
      }
    } else {
      // couldn't read the server: show whatever this device last saw, but NEVER write it back
      users = lsGet('allthing-users', true, null);
      if(!users && !(firebaseReady && fbDb)){ users = defaultUsers(); lsSet('allthing-users', true, users); }
    }
  }catch(err){
    console.error('All thing: 초기 데이터를 불러오는 중 문제가 있었어요.', err);
    // last resort if even the above somehow throws — read straight from the local mirror
    // rather than let a network hiccup look like everything got wiped
    users = lsGet('allthing-users', true, null);
    timetables = lsGet('allthing-timetables', true, {});
    meals = lsGet('allthing-meals', true, []);
    exams = lsGet('allthing-exams', true, []);
    events = lsGet('allthing-events', true, []);
    notices = lsGet('allthing-notices', true, []);
    session = lsGet('allthing-session', false, null);
  }

  state.users = users || defaultUsers(); // display-only fallback — intentionally NOT saved anywhere
  state.timetables = timetables || {};
  state.meals = meals || [];
  state.exams = exams || [];
  state.events = events || [];
  state.notices = notices || [];
  seedSeenNotices();

  if(session && session.id && state.users[session.id]){
    state.currentUser = session.id;
    state.view = 'home';
    // launched via a home-screen-icon shortcut (long-press → 급식/시간표/수행평가·시험)
    try{
      const requested = new URLSearchParams(location.search).get('view');
      const validShortcutViews = ['meals', 'timetable', 'exams'];
      if(requested && validShortcutViews.includes(requested)){
        state.view = requested;
      }
    }catch(e){}
  }
  state.booted = true;
  render();
  if(!state.currentUser) playSplash();
  startRealtimeSync();
}

/* ---------- near-real-time sync ----------
   If a Firebase project is configured (see FIREBASE_CONFIG above), this attaches live
   listeners so every change is pushed to connected classmates instantly. Otherwise it
   falls back to quietly polling the shared storage every few seconds — a static HTML
   file with no Firebase project has no server of its own to push updates from, so this
   polling fallback is the closest approximation without that setup.
   Either way, it's skipped while an edit form or the timetable editor is open, so it
   never overwrites something you're in the middle of typing.
*/
const SYNC_KEY_MAP = {
  'allthing-users':'users', 'allthing-timetables':'timetables', 'allthing-meals':'meals',
  'allthing-exams':'exams', 'allthing-events':'events', 'allthing-notices':'notices'
};
function applyRemoteUpdate(sKey, val){
  if(val === null || val === undefined) return;
  if(JSON.stringify(state[sKey]) === JSON.stringify(val)) return;
  state[sKey] = val;
  if(sKey === 'notices'){
    notifyNewNotices();
    if(state.view === 'notices') markNoticesRead(); // already looking at the tab — don't leave a stale badge
  }
  if(state.ttEditor.open || state.editing.section) return; // don't clobber an in-progress edit
  render();
}
function startRealtimeSync(){
  if(firebaseReady && fbDb){
    Object.keys(SYNC_KEY_MAP).forEach(key => {
      fbDb.ref('allthing/'+key).on('value', snap => {
        const val = snap.val();
        if(key === 'allthing-users' || key === 'allthing-timetables'){
          if(val === null || val === undefined) return; // never let an empty read erase accounts/timetables
          state[key === 'allthing-users' ? 'usersConfirmed' : 'timetablesConfirmed'] = true;
          lsSet(key, true, val);
          if(key === 'allthing-users') state.users = val; // keep login data current even on the login screen
          if(!state.currentUser) return;
          applyRemoteUpdate(SYNC_KEY_MAP[key], val);
          return;
        }
        if(!state.currentUser) return;
        const list = (val === null || val === undefined) ? [] : val; // a deleted-last-item list is genuinely empty
        lsSet(key, true, list);
        applyRemoteUpdate(SYNC_KEY_MAP[key], list);
      });
    });
    return;
  }
  startPolling();
}
let pollTimer = null;
function startPolling(){
  if(!storageOK || pollTimer) return;
  pollTimer = setInterval(async () => {
    if(!state.currentUser) return;
    if(typeof document !== 'undefined' && document.hidden) return;
    if(state.ttEditor.open || state.editing.section) return;
    try{
      const results = await Promise.all(Object.keys(SYNC_KEY_MAP).map(k => sGetRemoteOnly(k, true)));
      Object.keys(SYNC_KEY_MAP).forEach((k, i) => {
        const val = results[i];
        if(val === null) return;
        lsSet(k, true, val);
        applyRemoteUpdate(SYNC_KEY_MAP[k], val);
      });
    }catch(e){ /* a failed poll just tries again next tick */ }
  }, 5000);
}

/* ---------- auth ---------- */
async function handleLoginSubmit(){
  const idEl = document.getElementById('loginId');
  const pwEl = document.getElementById('loginPw');
  const rememberEl = document.getElementById('loginRemember');
  if(!idEl || !pwEl) return;
  const id = idEl.value.trim();
  const pw = pwEl.value.trim();
  const remember = rememberEl ? rememberEl.checked : true;
  let user = state.users[id];
  let ok = await verifyPassword(user, pw);
  if(!ok && firebaseReady && fbDb){
    // This device may be holding a stale/default copy of the accounts (e.g. it booted while
    // the server was unreachable). Re-check against the server before saying "wrong password".
    const r = await fbReadStrict('allthing-users', 6000);
    if(r.ok && r.val){
      state.users = r.val; state.usersConfirmed = true; lsSet('allthing-users', true, r.val);
      user = state.users[id];
      ok = await verifyPassword(user, pw);
    } else if(!r.ok){
      state.loginError = '서버와 연결이 확인되지 않아요. 인터넷 연결을 확인하고 다시 시도해주세요.';
      render();
      return;
    }
  }
  if(!ok){
    state.loginError = '아이디 또는 비밀번호가 올바르지 않아요.';
    render();
    return;
  }
  if(!user.pwHash && (!(firebaseReady && fbDb) || state.usersConfirmed)){
    // quietly upgrade this account's plain-text password to a hash (only touches this one account)
    passwordFieldChanges(id, pw, pw === id).then(ch => updateUsers(ch)).catch(() => {});
  }
  state.loginError = '';
  state.currentUser = id;
  state.view = 'home';
  // launched via a home-screen-icon shortcut but wasn't logged in yet — land on the
  // requested tab once login succeeds instead of just going to home
  try{
    const requested = new URLSearchParams(location.search).get('view');
    const validShortcutViews = ['meals', 'timetable', 'exams'];
    if(requested && validShortcutViews.includes(requested)){
      state.view = requested;
    }
  }catch(e){}
  state.brandAnimPlayed = false;
  state.navAnim = 'view-enter';
  if(remember){
    await sSet('allthing-session', { id, ts: Date.now() }, false);
  } else {
    await sDel('allthing-session', false);
  }
  render();
}
async function handleLogout(){
  if(state.game) stopGameSync();
  state.currentUser = null;
  state.view = 'home';
  state.splashPlayed = false;
  await sDel('allthing-session', false);
  render();
  playSplash();
}
function goto(view, animClass){
  state.navAnim = animClass || 'view-enter';
  if(view === 'notices' && state.view !== 'notices'){
    // Snapshot which notices are still unread right now, so THIS viewing still shows the NEW
    // badge on them — then mark everything read immediately (clears the nav dot right away,
    // and means the badge is gone by the next visit).
    const read = getReadNoticeIds();
    state.noticesUnreadSnapshot = new Set(state.notices.filter(n => !read.has(n.id)).map(n => n.id));
    markNoticesRead();
  }
  state.view = view;
  state.editing = { section:null, id:null, data:null };
  render();
  const main = document.getElementById('mainScroll');
  if(main){ main.style.scrollBehavior = 'auto'; main.scrollTop = 0; main.style.scrollBehavior = ''; }
  { const html = document.documentElement, old = html.style.scrollBehavior; html.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); html.style.scrollBehavior = old; }
  // Skip the nav bar's own auto-scroll animation during a swipe — running two independently-timed
  // animations (this scroll + the content slide) at once is what was producing the "bounce" feel.
  if(!animClass || animClass === 'view-enter'){
    const navEl = document.getElementById('bottomNavScroll');
    if(navEl){
      const activeBtn = navEl.querySelector('.bn-btn.active');
      if(activeBtn) activeBtn.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }
  }
}

async function acctSave(id){
  const idEl = document.getElementById('acctId');
  const nameEl = document.getElementById('acctName');
  const pwEl = document.getElementById('acctPw');
  const adminEl = document.getElementById('acctIsAdmin');
  if(!idEl) return;
  const newId = idEl.value.trim();
  const newName = nameEl ? nameEl.value.trim() : '';
  const newPw = pwEl ? pwEl.value : '';
  const newIsAdmin = adminEl ? adminEl.checked : !!state.users[id].isAdmin;
  if(!newId){ showToast('아이디를 입력해주세요.', 'err'); return; }
  if(!newName){ showToast('표시 이름을 입력해주세요.', 'err'); return; }
  if(newPw && newPw.length < 6){ showToast('비밀번호는 6자 이상으로 입력해주세요.', 'err'); return; }
  if(id === state.currentUser && !newIsAdmin){
    showToast('현재 로그인한 계정의 관리자 권한은 스스로 해제할 수 없어요.', 'err');
    return;
  }

  const renaming = newId !== id;
  try{
    if(!(await ensureConfirmed('allthing-users', 'usersConfirmed'))) return;
    if(renaming && state.users[newId]){ showToast('이미 사용 중인 아이디예요.', 'err'); return; }
    if(renaming){
      const record = Object.assign({}, state.users[id], { displayName: newName, isAdmin: newIsAdmin });
      if(newPw){ delete record.password; Object.assign(record, await passwordRecordFields(newPw, false)); }
      await updateUsers({ [newId]: record, [id]: null }); // one atomic move, nobody else touched
    } else {
      const changes = { [id+'/displayName']: newName, [id+'/isAdmin']: newIsAdmin };
      if(newPw) Object.assign(changes, await passwordFieldChanges(id, newPw, false));
      await updateUsers(changes);
    }
  }catch(e){ return; }
  if(renaming){
    await moveGamePlayer(id, newId);
    if(state.game && state.game.syncedFor === id) stopGameSync();
  }
  if(renaming && state.currentUser === id){
    state.currentUser = newId;
    const session = await sGet('allthing-session', false, null);
    if(session) await sSet('allthing-session', { id: newId, ts: Date.now() }, false);
  }
  showToast('계정 정보를 저장했어요.');
  state.acctEditing = null;
  render();
}

function setupLightboxZoom(){
  const overlay = document.querySelector('.lightbox-overlay');
  const img = document.querySelector('.lightbox-img');
  if(!overlay || !img) return;

  let scale = 1, tx = 0, ty = 0;
  const MIN_SCALE = 1, MAX_SCALE = 5;
  const pointers = new Map();
  let pinchStartDist = 0, pinchStartScale = 1;
  let panStart = null;
  let swipeStart = null; // one-finger drag while NOT zoomed — used to move to the next/prev photo
  let didInteract = false;

  function applyTransform(){
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    img.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
  }
  function clampScale(s){ return Math.max(MIN_SCALE, Math.min(MAX_SCALE, s)); }
  function clampPan(){
    // keep the image roughly within reach of the viewport once zoomed
    const rect = overlay.getBoundingClientRect();
    const maxX = (rect.width * (scale - 1)) / 2 + 40;
    const maxY = (rect.height * (scale - 1)) / 2 + 40;
    tx = Math.max(-maxX, Math.min(maxX, tx));
    ty = Math.max(-maxY, Math.min(maxY, ty));
  }
  function settle(){
    if(scale <= 1.001){ scale = 1; tx = 0; ty = 0; }
    applyTransform();
  }

  img.style.transition = 'none';
  img.style.touchAction = 'none';
  img.style.transformOrigin = 'center center';
  applyTransform();

  // PC: scroll wheel to zoom, centered near the cursor
  overlay.addEventListener('wheel', function(e){
    e.preventDefault();
    const rect = img.getBoundingClientRect();
    const prevScale = scale;
    scale = clampScale(scale * (1 - e.deltaY * 0.0018));
    const cx = e.clientX - (rect.left + rect.width/2);
    const cy = e.clientY - (rect.top + rect.height/2);
    tx -= cx * (scale/prevScale - 1);
    ty -= cy * (scale/prevScale - 1);
    clampPan();
    settle();
  }, { passive:false });

  // touch: pinch to zoom, single-finger drag to pan once zoomed
  overlay.addEventListener('pointerdown', function(e){
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 2){
      const pts = Array.from(pointers.values());
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinchStartScale = scale;
      panStart = null;
    } else if(pointers.size === 1 && scale > 1){
      panStart = { x: e.clientX, y: e.clientY, tx, ty };
    } else if(pointers.size === 1){
      swipeStart = { x: e.clientX, y: e.clientY };
    }
  });
  overlay.addEventListener('pointermove', function(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 2){
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(pinchStartDist > 0){
        didInteract = true;
        scale = clampScale(pinchStartScale * (dist / pinchStartDist));
        clampPan();
        applyTransform();
      }
    } else if(pointers.size === 1 && panStart && scale > 1){
      didInteract = true;
      tx = panStart.tx + (e.clientX - panStart.x);
      ty = panStart.ty + (e.clientY - panStart.y);
      clampPan();
      applyTransform();
    }
  });
  function endPointer(e){
    if(swipeStart && scale <= 1 && pointers.size === 1){
      const dx = e.clientX - swipeStart.x;
      const dy = e.clientY - swipeStart.y;
      if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6){
        didInteract = true;
        navigateLightbox(dx < 0 ? 1 : -1); // swipe left = next photo, matching the rest of the app
      }
    }
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinchStartDist = 0;
    if(pointers.size === 0){ panStart = null; swipeStart = null; settle(); }
  }
  overlay.addEventListener('pointerup', endPointer);
  overlay.addEventListener('pointercancel', endPointer);
  overlay.addEventListener('pointerleave', endPointer);

  // don't let a pinch/pan gesture that ends over the backdrop accidentally close the lightbox
  overlay.addEventListener('click', function(e){
    if(didInteract){ e.stopPropagation(); didInteract = false; }
  }, true);
}
