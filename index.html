/* Photos of handouts/worksheets need enough resolution to actually read the text, so this
   aims high (1800px, quality .88) and only steps down if the result would be too heavy to
   sync. The cap matters because photos are stored as base64 inside the shared data blob —
   letting one photo balloon would slow every device's sync and can overflow local storage. */
const PHOTO_MAX_DIM = 1800;
const PHOTO_QUALITY = 0.88;
const PHOTO_BUDGET_BYTES = 900 * 1024; // per photo, measured on the encoded data URL
function resizeImageToDataUrl(file, maxDim, quality){
  maxDim = maxDim || PHOTO_MAX_DIM;
  quality = quality || PHOTO_QUALITY;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        function encode(dim, q){
          let w = img.width, h = img.height;
          if(w > dim || h > dim){
            if(w > h){ h = Math.round(h * dim / w); w = dim; }
            else { w = Math.round(w * dim / h); h = dim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          // better downscaling than the browser default — noticeably sharper text
          ctx.imageSmoothingEnabled = true;
          if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          return canvas.toDataURL('image/jpeg', q);
        }
        // start at full requested quality, back off only as far as needed to fit the budget
        const attempts = [[maxDim, quality], [maxDim, 0.8], [1400, 0.8], [1200, 0.75], [900, 0.72]];
        let out = null;
        for(const [d, q] of attempts){
          out = encode(d, q);
          if(out.length <= PHOTO_BUDGET_BYTES) break;
        }
        resolve(out);
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
async function submitSectionForm(section){
  const cfg = SECTIONS[section];
  const data = {};
  const pendingExternal = {};
  for(const f of cfg.fields){
    let val;
    if(f.type === 'image'){
      const fileInput = document.getElementById('field-'+f.name);
      const removeEl = document.getElementById('field-'+f.name+'-remove');
      const existing = (state.editing.data && state.editing.data[f.name]) || '';
      if(removeEl && removeEl.checked){
        val = '';
      } else if(fileInput && fileInput.files && fileInput.files[0]){
        try{
          val = await resizeImageToDataUrl(fileInput.files[0]);
        }catch(e){
          showToast('사진을 처리하지 못했어요.', 'err');
          return;
        }
      } else {
        val = existing;
      }
    } else if(f.type === 'images'){
      const container = document.getElementById('group-'+f.name);
      const kept = container ? Array.from(container.querySelectorAll('.photo-thumb')).map(el => el.dataset.photo) : [];
      const fileInput = document.getElementById('field-'+f.name);
      let newOnes = [];
      if(fileInput && fileInput.files && fileInput.files.length){
        try{
          newOnes = await Promise.all(Array.from(fileInput.files).map(file => resizeImageToDataUrl(file)));
        }catch(e){
          showToast('사진을 처리하지 못했어요.', 'err');
          return;
        }
      }
      val = kept.concat(newOnes);
      if(f.external){
        pendingExternal[f.name] = val;
        data[f.countField || (f.name+'Count')] = val.length; // lightweight marker kept in the synced record
        if(f.required && val.length === 0){
          showToast(f.label+'을(를) 입력해주세요.', 'err');
          return;
        }
        continue; // the actual bytes are kept out of `data` entirely — never goes into the live-synced record
      }
    } else if(f.type === 'checkbox'){
      const el = document.getElementById('field-'+f.name);
      val = !!(el && el.checked);
      data[f.name] = val;
      continue;
    } else if(f.type === 'select'){
      const checked = document.querySelector('input[name="field-'+f.name+'"]:checked');
      val = checked ? checked.value : ((f.options && f.options[0]) ? f.options[0].value : '');
    } else if(f.type === 'multitext'){
      const inputs = document.querySelectorAll('.multitext-input[data-group="'+f.name+'"]');
      val = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
    } else {
      const el = document.getElementById('field-'+f.name);
      if(!el) return;
      val = el.value;
      if(f.type === 'lines'){
        val = val.split('\n').map(s=>s.trim()).filter(Boolean);
      } else {
        val = val.trim();
      }
    }
    if(f.required && (!val || (Array.isArray(val) && val.length===0))){
      showToast(f.label+'을(를) 입력해주세요.', 'err');
      return;
    }
    data[f.name] = val;
  }
  if(cfg.validate){
    const err = cfg.validate(data);
    if(err){ showToast(err, 'err'); return; }
  }
  const id = state.editing.id;
  const saved = await saveSectionItem(section, id, data);
  for(const fieldName of Object.keys(pendingExternal)){
    if(fieldName === 'photos') await savePhotosForItem(saved.id, pendingExternal[fieldName]);
  }
  if(section === 'notices'){ seedSeenNotices(); markNoticesRead(); } // this device already knows about the notice it just posted
  state.editing = { section:null, id:null, data:null };
  showToast(id ? '수정했어요.' : '추가했어요.');
  render();
}

function isPastItem(section, it){
  if(section === 'notices') return false;
  const cutoff = it.endDate || it.date || '';
  return cutoff < todayStr();
}
function renderSectionList(section, overrideList, mode){
  const cfg = SECTIONS[section];
  let list = overrideList || state[section];
  if(section === 'notices') list = list.slice().reverse();
  const renderItem = (it) => `
    <div class="list-item ${isPastItem(section, it) ? 'past' : ''}">
      <div class="list-item-body">${cfg.rowHtml(it)}</div>
      ${isAdmin() ? `
      <div class="list-item-actions">
        <button class="icon-btn" data-act="openEdit" data-section="${section}" data-id="${it.id}" aria-label="수정">${icon('edit')}</button>
        <button class="icon-btn danger" data-act="deleteItem" data-section="${section}" data-id="${it.id}" aria-label="삭제">${icon('trash')}</button>
      </div>` : ''}
    </div>
  `;
  // 'upcoming' / 'past' let a caller render the two groups in separate places (the exams
  // split view puts every past item below both columns instead of inside each one)
  if(mode === 'upcoming' || mode === 'past'){
    const subset = list.filter(it => mode === 'past' ? isPastItem(section, it) : !isPastItem(section, it));
    if(mode === 'past'){
      subset.sort((a,b) => (b.endDate||b.date||'').localeCompare(a.endDate||a.date||''));
      return subset.length ? `<div class="list">${subset.map(renderItem).join('')}</div>` : '';
    }
    return subset.length
      ? `<div class="list">${subset.map(renderItem).join('')}</div>`
      : `<div class="empty-state">${icon(cfg.icon)}<p>${cfg.emptyMsg}</p></div>`;
  }
  if(list.length === 0){
    return `<div class="empty-state">${icon(cfg.icon)}<p>${cfg.emptyMsg}</p></div>`;
  }
  if(!cfg.pastLabel){
    return `<div class="list">${list.map(renderItem).join('')}</div>`;
  }
  const upcoming = list.filter(it => !isPastItem(section, it));
  const past = list.filter(it => isPastItem(section, it))
    .slice().sort((a,b) => (b.endDate||b.date||'').localeCompare(a.endDate||a.date||''));
  return `
    ${upcoming.length ? `<div class="list">${upcoming.map(renderItem).join('')}</div>` : `<div class="empty-state">${icon(cfg.icon)}<p>${cfg.emptyMsg}</p></div>`}
    ${past.length ? `
    <div class="section-divider">${esc(cfg.pastLabel)}</div>
    <div class="list">${past.map(renderItem).join('')}</div>` : ''}
  `;
}

/* ---------- meal JSON import (NEIS 급식식단정보 오픈API export) ---------- */
const MEAL_TYPE_MAP = { '조식':'breakfast', '중식':'lunch', '석식':'dinner', '조':'breakfast', '중':'lunch', '석':'dinner' };
function cleanDishName(raw){
  return String(raw || '')
    .replace(/\(([\d.\s]+)\)\s*$/, '')
    .replace(/\*+$/, '')
    .trim();
}
async function handleMealJsonFile(file){
  if(!file) return;
  let rows;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    rows = Array.isArray(parsed) ? parsed : ((parsed && parsed.mealServiceDietInfo && parsed.mealServiceDietInfo[1] && parsed.mealServiceDietInfo[1].row) || []);
  }catch(e){
    showToast('JSON 파일을 읽지 못했어요. 파일 형식을 확인해주세요.', 'err');
    return;
  }
  const valid = rows.filter(r => r && typeof r.MLSV_YMD === 'string' && /^\d{8}$/.test(r.MLSV_YMD));
  if(valid.length === 0){
    showToast('가져올 급식 데이터를 찾지 못했어요.', 'err');
    return;
  }
  const freshMeals = await freshSharedValue(SECTIONS.meals.storageKey, []);
  const existing = {};
  (Array.isArray(freshMeals) ? freshMeals : []).forEach(m => { existing[m.date] = m; });
  const touchedDates = new Set();
  valid.forEach(r => {
    const date = r.MLSV_YMD.slice(0,4)+'-'+r.MLSV_YMD.slice(4,6)+'-'+r.MLSV_YMD.slice(6,8);
    const key = MEAL_TYPE_MAP[(r.MMEAL_SC_NM || '').trim()];
    const dishes = String(r.DDISH_NM || '').split('<br/>').map(cleanDishName).filter(Boolean);
    if(!touchedDates.has(date)){
      const prevId = existing[date] && existing[date].id;
      existing[date] = { id: prevId || uid(), date, breakfast: [], lunch: [], dinner: [] };
      touchedDates.add(date);
    }
    if(key){
      existing[date][key] = dishes;
      if(r.CAL_INFO) existing[date][key+'Cal'] = String(r.CAL_INFO).trim();
    }
  });
  state.meals = Object.values(existing).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  await sSet(SECTIONS.meals.storageKey, state.meals, true);
  showToast(`${touchedDates.size}일치 급식을 불러왔어요.`);
  render();
}

/* ---------- subject abbreviation expansion ----------
   Matching is exact on the trimmed subject line, so running this twice is harmless: an
   already-expanded name no longer matches any key. Lines like "(2-7)" are left untouched.
*/
const SUBJECT_ABBREV = {
  '지시과': '지구시스템과학',
  '지구과학시스템': '지구시스템과학', // corrects timetables already expanded with the old wording
  '한지탐': '한국지리 탐구',
  '물질': '물질과 에너지',
  '역학': '역학과 에너지',
  '인수': '인공지능 수학',
  '인공': '인공지능 기초',
  '융과탐': '융합과학탐구',
  '법사': '법과 사회',
  '윤사': '윤리와 사상',
  '사문탐': '사회문제 탐구',
  '동역': '동아시아 역사 기행',
  '일회': '일본어 회화'
};
function expandSubjectCell(cell){
  if(!cell) return cell;
  return cell.split('\n').map(line => {
    const trimmed = line.trim();
    if(SUBJECT_ABBREV[trimmed]) return SUBJECT_ABBREV[trimmed];
    // also handle the abbreviation sitting on the same line as the class, e.g. "지시과(2-7)"
    for(const key of Object.keys(SUBJECT_ABBREV)){
      if(trimmed.startsWith(key)){
        const rest = trimmed.slice(key.length);
        if(rest.startsWith('(')) return SUBJECT_ABBREV[key] + rest;
      }
    }
    return line;
  }).join('\n');
}

async function applyImportedTimetables_20260831(){
  if(!confirm('업로드해주신 파일 기준으로 20801~20824 전체 시간표를 덮어씁니다. 계속할까요?')) return;
  const count = Object.keys(TT_IMPORT_20260831).length;
  try{ await updateTimetables(Object.assign({}, TT_IMPORT_20260831)); }catch(e){ return; }
  if(state.ttEditor.open && state.ttEditor.no && TT_IMPORT_20260831[state.ttEditor.no]){
    state.ttEditor.grid = TT_IMPORT_20260831[state.ttEditor.no];
  }
  showToast(count + '명의 시간표를 새로 적용했어요.');
  render();
}
async function expandAllTimetableAbbrevs(){
  let changed = 0;
  const updates = {};
  try{
    if(!(await ensureConfirmed('allthing-timetables', 'timetablesConfirmed'))) return;
    Object.keys(state.timetables).forEach(no => {
      const grid = state.timetables[no] || {};
      const newGrid = {};
      let touched = false;
      Object.keys(grid).forEach(day => {
        newGrid[day] = (grid[day] || []).map(cell => {
          const out = expandSubjectCell(cell);
          if(out !== cell){ changed++; touched = true; }
          return out;
        });
      });
      if(touched) updates[no] = newGrid; // only students whose timetable actually changed
    });
    if(changed > 0) await updateTimetables(updates);
  }catch(e){ return; }
  if(changed === 0){ showToast('바꿀 줄임말이 없어요.'); return; }
  if(state.ttEditor.open && state.ttEditor.no){
    state.ttEditor.grid = state.timetables[state.ttEditor.no] || state.ttEditor.grid;
  }
  showToast(changed + '개 칸의 줄임말을 펼쳤어요.');
  render();
}

/* ---------- home view ---------- */
function homeMealSummary(){
  const t = state.meals.find(m => m.date === todayStr());
  const html = t ? mealGroupsHtml(t) : '';
  if(!html) return `<p class="text-2">오늘은 급식 정보가 없어요.</p>`;
  return html;
}
function homeTimetableSummary(){
  const u = me();
  const day = WEEKDAY_KO[new Date().getDay()];
  if(!DAYS.includes(day)) return `<p class="text-2">오늘은 등교하지 않는 날이에요.</p>`;
  if(!u.studentNo || !state.timetables[u.studentNo]) return `<p class="text-2">아직 시간표가 없어요.</p>`;
  const grid = state.timetables[u.studentNo];
  const list = PERIODS.map((p,i)=>({ p, s: (grid[day]||[])[i] || '' })).filter(x => x.s);
  if(list.length === 0) return `<p class="text-2">오늘은 등록된 수업이 없어요.</p>`;
  return `<div class="mini-list">${list.map(x=>`<div class="mini-row"><span class="mini-p">${x.p}교시</span><span>${esc(x.s)}</span></div>`).join('')}</div>`;
}
function homeUpcomingExams(){
  const list = state.exams.filter(x => (x.endDate || x.date) >= todayStr()).slice(0,2);
  if(list.length === 0) return `<p class="text-2">${SECTIONS.exams.emptyMsg}</p>`;
  return `<div class="mini-list">${list.map(it => {
    const dd = dDayInfo(it.date, it.endDate);
    return `<div class="mini-row"><span class="dday sm ${dd.cls}">${dd.label}</span><span>${esc(it.subject)} · ${esc(it.title)}</span></div>`;
  }).join('')}</div>`;
}
function homeUpcomingEvents(){
  const list = state.events.filter(x => (x.endDate || x.date) >= todayStr()).slice(0,2);
  if(list.length === 0) return `<p class="text-2">${SECTIONS.events.emptyMsg}</p>`;
  return `<div class="mini-list">${list.map(it => {
    const dd = dDayInfo(it.date, it.endDate);
    return `<div class="mini-row"><span class="dday sm ${dd.cls}">${dd.label}</span><span>${esc(it.title)}</span></div>`;
  }).join('')}</div>`;
}

/* ---------- splash animation ---------- */
function playSplash(){
  if(state.currentUser) return;
  const word = document.getElementById('morphWord');
  const heroEl = document.getElementById('hero');
  const card = document.getElementById('loginCard');
  if(!word || !heroEl) return;

  // 초기 상태: 흰색 '모든 것', 화면 중앙에 크게
  word.classList.remove('morphed','shake','pop','charge');
  word.textContent = '모든 것';
  heroEl.classList.remove('compact');
  if(card) card.classList.add('pending');

  // 브라우저가 흰색 글자를 렌더링하도록 다음 프레임에서 애니메이션 시작
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // 1. 아쿠아색으로 물드는 효과 시작
      word.classList.add('charge');

      // 2. 0.85초 후 텍스트 흔들림
      setTimeout(() => word.classList.add('shake'), 850);

      // 3. 1.3초 후 폭죽 효과 + 'All thing' 교체 + 팝 효과
      setTimeout(() => {
        burstConfetti(word);
        word.classList.remove('shake','charge');
        word.textContent = 'All thing';
        word.classList.add('morphed','pop');
      }, 1300);

      // 4. 1.85초 후 (폭죽이 잠시 보인 다음) 제목이 로그인 화면 상단 자리로 축소 이동 + 로그인 카드 등장
      setTimeout(() => {
        heroEl.classList.add('compact');
        if(card){ card.classList.remove('pending'); card.classList.add('show'); }
        state.splashPlayed = true;
      }, 1850);
    });
  });
}
function burstConfetti(targetEl){
  const rect = targetEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ['#838952','#6B7143','#B8752E','#FFFCF5','#A9AE7C'];
  let root = document.getElementById('confettiRoot');
  if(!root){
    root = document.createElement('div');
    root.id = 'confettiRoot';
    root.className = 'confetti-root';
    document.body.appendChild(root);
  }
  const count = 34;
  for(let i=0;i<count;i++){
    const p = document.createElement('span');
    const isBar = Math.random() < 0.35;
    p.className = 'confetti-piece ' + (isBar ? 'bar' : 'dot');
    const angle = Math.random() * Math.PI * 2;
    const dist1 = 26 + Math.random()*42;
    const dist2 = dist1 + 22 + Math.random()*42;
    const tx1 = Math.cos(angle)*dist1, ty1 = Math.sin(angle)*dist1;
    const tx2 = Math.cos(angle)*dist2*0.6, ty2 = ty1 + 40 + Math.random()*46;
    const size = isBar ? (3+Math.random()*2.4) : (3.5+Math.random()*3.5);
    p.style.left = cx+'px';
    p.style.top = cy+'px';
    p.style.setProperty('--tx1', tx1.toFixed(1)+'px');
    p.style.setProperty('--ty1', ty1.toFixed(1)+'px');
    p.style.setProperty('--tx2', tx2.toFixed(1)+'px');
    p.style.setProperty('--ty2', ty2.toFixed(1)+'px');
    p.style.setProperty('--rot', (Math.random()*540-270).toFixed(0)+'deg');
    p.style.setProperty('--size', size.toFixed(1)+'px');
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (620+Math.random()*420)+'ms';
    p.style.animationDelay = (Math.random()*90)+'ms';
    root.appendChild(p);
  }
  setTimeout(() => { root.innerHTML = ''; }, 1500);
}

function updateBottomNavEdges(el){
  if(!el) return;
  const wrap = el.parentElement;
  if(!wrap) return;
  const hasOverflow = el.scrollWidth > el.clientWidth + 1;
  const atStart = el.scrollLeft <= 1;
  const atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
  wrap.classList.toggle('at-start', hasOverflow && atStart);
  wrap.classList.toggle('at-end', hasOverflow && atEnd);
}
function isMobileLayoutActive(){
  const sidebar = document.querySelector('.sidebar');
  if(!sidebar) return true;
  return getComputedStyle(sidebar).display === 'none';
}
async function toggleLayout(){
  // Real device rotation only makes sense on an actual touchscreen (phone/tablet) — on desktop,
  // screen.orientation.lock() can trivially "succeed" without doing anything real, which would
  // wrongly skip the manual layout toggle. So only attempt it on touch-primary devices.
  const isTouchDevice = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
  try{
    if(isTouchDevice && screen.orientation && screen.orientation.lock){
      if(!document.fullscreenElement && document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen().catch(() => {});
      }
      const current = screen.orientation.type || '';
      const goingLandscape = !current.startsWith('landscape');
      await screen.orientation.lock(goingLandscape ? 'landscape' : 'portrait');
      state.forceLayout = null;
      lsSet('layout-pref', false, null);
      render();
      return;
    }
  }catch(e){ /* not allowed here (plain browser tab) — fall through to the manual toggle */ }
  if(!state.forceLayout){
    state.forceLayout = isMobileLayoutActive() ? 'pc' : 'mobile';
  } else {
    state.forceLayout = state.forceLayout === 'pc' ? 'mobile' : 'pc';
  }
  lsSet('layout-pref', false, state.forceLayout);
  render();
}

/* ---------- resizable / collapsible sidebar ---------- */
const SIDEBAR_MIN = 76;
const SIDEBAR_MAX = 320;
const SIDEBAR_DEFAULT = 236;
const SIDEBAR_COLLAPSE_AT = 130;
function sidebarWidthPref(){
  const w = lsGet('sidebar-width', false, SIDEBAR_DEFAULT);
  return Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, Number(w) || SIDEBAR_DEFAULT));
}
function applySidebarWidth(w){
  document.documentElement.style.setProperty('--sidebar-w', w + 'px');
  const sidebar = document.querySelector('.sidebar');
  if(sidebar) sidebar.classList.toggle('collapsed', w < SIDEBAR_COLLAPSE_AT);
}
(function setupSidebarResize(){
  let dragging = false, startX = 0, startW = SIDEBAR_DEFAULT;
  document.addEventListener('pointerdown', function(e){
    const handle = e.target.closest && e.target.closest('#sidebarResizeHandle');
    if(!handle) return;
    dragging = true;
    startX = e.clientX;
    const sidebar = document.querySelector('.sidebar');
    startW = sidebar ? sidebar.getBoundingClientRect().width : SIDEBAR_DEFAULT;
    handle.classList.add('dragging');
    if(handle.setPointerCapture) { try{ handle.setPointerCapture(e.pointerId); }catch(err){} }
    e.preventDefault();
  });
  document.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const dx = e.clientX - startX;
    let w = Math.round(startW + dx);
    w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, w));
    applySidebarWidth(w);
  });
  function stop(){
    if(!dragging) return;
    dragging = false;
    const handle = document.getElementById('sidebarResizeHandle');
    if(handle) handle.classList.remove('dragging');
    const val = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w');
    const w = parseInt(val) || SIDEBAR_DEFAULT;
    lsSet('sidebar-width', false, w);
  }
  document.addEventListener('pointerup', stop);
  document.addEventListener('pointercancel', stop);
})();

function restoreScroll(k){
  const set = (el, prop, v) => { if(!el || !v) return; const old = el.style.scrollBehavior; el.style.scrollBehavior = 'auto'; el[prop] = v; el.style.scrollBehavior = old; };
  set(document.getElementById('mainScroll'), 'scrollTop', k.main);
  set(document.getElementById('bottomNavScroll'), 'scrollLeft', k.nav);
  set(document.querySelector('.side-nav'), 'scrollTop', k.side);
  set(document.querySelector('.game-tabs'), 'scrollLeft', k.tabs);
  set(document.querySelector('.modal'), 'scrollTop', k.modal);
  if(k.win && Math.abs(window.scrollY - k.win) > 1){
    const html = document.documentElement, old = html.style.scrollBehavior;
    html.style.scrollBehavior = 'auto'; window.scrollTo(0, k.win); html.style.scrollBehavior = old;
  }
}

/* ---------- event delegation (avoids relying on inline on* attributes) ---------- */
function bindEvents(){
  document.addEventListener('click', function(e){
    const el = e.target.closest('[data-act]');
    if(!el) return;
    if(el.hasAttribute('data-backdrop') && e.target !== el) return;
    const act = el.getAttribute('data-act');
    switch(act){
      case 'goto': goto(el.dataset.view); break;
      case 'logout': handleLogout(); break;
      case 'openAdd': openAddForm(el.dataset.section, el.dataset.date); break;
      case 'openEdit': Promise.resolve(openEditForm(el.dataset.section, el.dataset.id)).catch(err => {
        console.error('All thing: 수정 창을 여는 중 문제가 있었어요.', err);
        showToast('수정 창을 열지 못했어요.', 'err');

      case 'ttCopy': copyTtFrom(); break;

      case 'gameMax': gameSetMax(el.dataset.side, el.dataset.stock); break;
      case 'gameChart': state.game.chartOpen = state.game.chartOpen === el.dataset.stock ? null : el.dataset.stock; render(); break;
      case 'gameBuyItem': gameBuyItem(el.dataset.item); break;
      case 'orderForm': openOrderForm(el.dataset.stock); break;

function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function isStandaloneApp(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // if a newer sw.js is already waiting (from a previous visit), activate it now
      if(reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            nw.postMessage('skipWaiting');
          }
        });
      });
    }).catch(() => {});
    // a new service worker just took control — reload once so the fresh files are used
    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  });
}

/* ---------- swipe left/right between tabs (mobile) ---------- */
(function setupSwipeNav(){
  let startX = 0, startY = 0, touching = false, skip = false, decided = false, horizontal = false;
  const THRESHOLD = 55;
  const DIR_LOCK = 10;
  document.addEventListener('touchstart', function(e){
    if(!state.currentUser || !e.touches || !e.touches[0]) return;
    if(!isMobileLayoutActive()) { skip = true; return; }
    if(state.ttEditor.open || state.editing.section || state.lightboxSrc || document.querySelector('.modal-overlay')) { skip = true; return; }
    skip = !!e.target.closest('.tt-wrap, .tt-edit-wrap, .chip-select, .bottom-nav, .date-pills, .lightbox-overlay, input, textarea');
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; touching = true; decided = false; horizontal = false;
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if(!touching || skip || !e.touches || !e.touches[0]) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(!decided && (Math.abs(dx) > DIR_LOCK || Math.abs(dy) > DIR_LOCK)){
      decided = true;
      horizontal = Math.abs(dx) > Math.abs(dy) * 1.6;
    }
    // Once we know it's a horizontal swipe, tell the browser we're handling it — this stops
    // Samsung/Chrome's own edge-swipe-back and toolbar-hide gestures from firing at the same
    // time as our slide animation, which is what was producing the "bounce".
    if(horizontal && e.cancelable) e.preventDefault();
  }, { passive:false });
  document.addEventListener('touchend', function(e){
    if(!touching) return;
    touching = false;
    if(skip || !e.changedTouches || !e.changedTouches[0]) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(Math.abs(dx) > THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.6){
      const nav = visibleNav();
      const idx = nav.findIndex(n => n.key === state.view);
      if(idx === -1) return;
      if(dx < 0 && idx < nav.length - 1){
        goto(nav[idx+1].key, 'enter-right');
      } else if(dx > 0 && idx > 0){
        goto(nav[idx-1].key, 'enter-left');
      }
    }
  }, { passive:true });
})();

/* ---------- press back again to exit ----------
   On mobile, the browser/OS back button normally leaves the app on the very first press,
   which is easy to hit by accident. This pushes a harmless extra history entry so the first
   back press is caught (shown as a toast) instead of leaving; pressing back again within a
   couple seconds lets it through so the app actually closes.
*/
(function setupBackToExit(){
  const EXIT_WINDOW = 2000;
  let lastBackAt = 0;
  let programmaticBack = false;
  function armGuard(){
    try{ history.pushState({ allthingGuard: true }, '', location.href); }catch(e){}
  }
  window.addEventListener('popstate', function(){
    if(programmaticBack){ programmaticBack = false; return; } // our own history.back() below — let it proceed
    const now = Date.now();
    if(lastBackAt && now - lastBackAt < EXIT_WINDOW){
      // second press within the window — go back one more step to actually leave, since the
      // guard entry we pushed points at the same page and wouldn't exit on its own
      lastBackAt = 0;
      programmaticBack = true;
      history.back();
      return;
    }
    lastBackAt = now;
    showToast('뒤로 가기를 한 번 더 누르면 앱이 종료돼요.');
    armGuard();
  });
  armGuard();
  // Some mobile browsers don't fully register a pushState call made this early (right at
  // script load, before the page has "settled" or seen any user interaction) — the very
  // first back press then skips straight past it. Re-arming on load and on the first touch
  // makes sure the guard is in place by the time a real back press can happen.
  window.addEventListener('load', armGuard);
  window.addEventListener('pageshow', armGuard);
  document.addEventListener('touchstart', armGuard, { once:true, capture:true });
  document.addEventListener('click', armGuard, { once:true, capture:true });
})();

const NIGHT_START = 23*60, NIGHT_END = 7*60;
function isNightMinute(mins){ return mins >= NIGHT_START || mins < NIGHT_END; }
function isFrozenTick(tickNo){ const d = new Date(tickNo * GAME_TICK_MS); return isNightMinute(d.getHours()*60 + d.getMinutes()); }
function newsSlotTimes(d){
  const wd = d.getDay();
  const count = holidayInfo(d) ? 0 : (PERIODS_BY_WEEKDAY[wd] || 0);
  const end = count ? CLASS_PERIODS[count - 1][1] : '16:30'; // no school that day: treat 16:30 as "after school"
  return [hmToMin('12:30'), hmToMin(end)];
}
function isNewsSlot(tickNo){
  const d = new Date(tickNo * GAME_TICK_MS);
  return newsSlotTimes(d).indexOf(d.getHours()*60 + d.getMinutes()) !== -1;
}
// How sectors pull on each other: negative = rivals (move opposite), positive = partners (move together)
const STOCK_LINKS = {
  meal:    { store:-0.6, gym: 0.4 },              // 급식 vs 매점: 같은 점심값을 두고 경쟁 / 체육활동 늘면 급식 수요↑
  store:   { meal:-0.6, break: 0.5 },             // 전자기기가 잘 팔리면 게임도 잘 됨
  library: { break:-0.6 },                        // 공부 vs 게임: 관심을 두고 경쟁
  break:   { library:-0.6, store: 0.5, gym:-0.3 },
  gym:     { meal: 0.4, break:-0.3 }              // 밖에서 운동 vs 실내 게임
};
// how hard each personality reacts to news
const TYPE_IMPACT = { '안정형':0.6, '성장형':1.0, '고위험':1.6, '테마형':1.3 };
function stockInfo(id){ return GAME_STOCKS.find(s => s.id === id); }
function makeNewsEvent(tickNo){
  const t = NEWS_TEMPLATES[Math.floor(Math.random() * NEWS_TEMPLATES.length)];
  const effects = [];
  let body;
  if(t.stock === '*'){
    GAME_STOCKS.forEach(s => {
      const shock = t.dir * (0.02 + Math.random()*0.03) * TYPE_IMPACT[s.type];
      effects.push({ stock:s.id, dir:t.dir, shock, k: TREND_K * 0.6 });
    });
    const avg = Math.round(effects.reduce((a,e) => a + Math.abs(e.shock), 0) / effects.length * 1000) / 10;
    body = `시장 전체가 평균 ${avg}% ${t.dir > 0 ? '상승' : '하락'}했습니다. 당분간 ${t.dir > 0 ? '강세' : '약세'}가 이어질 수 있어요.`;
  } else {
    const main = stockInfo(t.stock);
    const mainShock = t.dir * (0.06 + Math.random()*0.05) * TYPE_IMPACT[main.type];
    effects.push({ stock:main.id, dir:t.dir, shock:mainShock, k: TREND_K });
    const rivals = [], partners = [];
    Object.keys(STOCK_LINKS[main.id] || {}).forEach(id => {
      const c = STOCK_LINKS[main.id][id], d = t.dir * Math.sign(c);
      effects.push({ stock:id, dir:d, shock: mainShock * c * 0.6, k: TREND_K * Math.abs(c) * 0.8 });
      (c < 0 ? rivals : partners).push(stockName(id));
    });
    const pct = Math.round(Math.abs(mainShock) * 1000) / 10;
    body = `${main.sector}산업 주식(${main.name})이 ${pct}% ${t.dir > 0 ? '상승' : '하락'}했습니다. 당분간 ${t.dir > 0 ? '강세' : '약세'}가 이어질 수 있어요.`;
    if(rivals.length) body += ` 경쟁 관계인 ${rivals.join('·')}은(는) 반대로 움직이고,`;
    if(partners.length) body += ` 협력 관계인 ${partners.join('·')}은(는) 같은 방향으로 움직일 수 있어요.`;
    else if(rivals.length) body = body.replace(/,$/, '일 수 있어요.');
  }
  const id = 'n' + tickNo;
  return {
    effects,
    record: { id, tick: tickNo, at: tickNo * GAME_TICK_MS, emoji: t.emoji, title: t.title, body,
              stocks: effects.map(e => e.stock), dir: t.dir,
              fx: effects.map(e => ({ s: e.stock, d: e.dir, p: Math.round(e.shock * 1000) / 10 })) }
  };
}
function gameTickNow(){ return Math.floor(Date.now() / GAME_TICK_MS); }
function hmToMin(str){ const p = str.split(':').map(Number); return p[0]*60 + p[1]; }
function marketStatus(d){
  d = d || new Date();
  const wd = d.getDay();
  const mins = d.getHours()*60 + d.getMinutes();
  const night = isNightMinute(mins);
  const hol = holidayInfo(d);
  if(hol) return { open:true, night, dayKind: hol.kind, holidayTitle: hol.title };
  const count = PERIODS_BY_WEEKDAY[wd] || 0;
  for(let i = 0; i < count; i++){
    if(mins >= hmToMin(CLASS_PERIODS[i][0]) && mins < hmToMin(CLASS_PERIODS[i][1])){
      return { open:false, period:i+1, reopen:CLASS_PERIODS[i][1] };
    }
  }
  return { open:true, night };
}
function nextMovingTick(){ let t = gameTickNow() + 1; for(let i = 0; i < 48 && isFrozenTick(t); i++) t++; return t; }
function nextTickLabel(){ const t = new Date(nextMovingTick() * GAME_TICK_MS); return pad2(t.getHours()) + ':' + pad2(t.getMinutes()); }
function fmtWon(n){ return Math.round(n || 0).toLocaleString('ko-KR') + '원'; }
function stockName(id){ const s = GAME_STOCKS.find(x => x.id === id); return s ? s.name : id; }

/* ---- storage: real Firebase when configured, otherwise a localStorage stand-in with the same API ---- */
const localGameDb = (function(){
  const KEY = 'allthing:game-local';
  let listeners = [];
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
  function get(d, path){ return path.split('/').reduce((o,k) => (o == null ? undefined : o[k]), d); }
  function put(d, path, v){
    const ks = path.split('/'); let o = d;
    for(let i = 0; i < ks.length-1; i++){ if(o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length-1];
    if(v == null) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
  }
  function snap(v){ return { val: () => (v === undefined ? null : v) }; }
  function notify(){ const d = load(); listeners.forEach(x => x.cb(snap(get(d, x.path)))); }
  function ref(path){
    return {
      once(){ return Promise.resolve(snap(get(load(), path))); },
      on(evt, cb){ listeners.push({ path, cb }); cb(snap(get(load(), path))); },
      off(){ listeners = listeners.filter(x => x.path !== path); },
      update(ch){ const d = load(); Object.keys(ch).forEach(k => put(d, path+'/'+k, ch[k])); save(d); notify(); return Promise.resolve(); },
      set(v){ const d = load(); put(d, path, v); save(d); notify(); return Promise.resolve(); },
      push(v){ const k = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); const d = load(); put(d, path+'/'+k, v); save(d); notify(); return Promise.resolve(); },
      transaction(fn){
        const d = load(); const cur = get(d, path);
        const next = fn(cur === undefined ? null : JSON.parse(JSON.stringify(cur)));
        if(next === undefined) return Promise.resolve({ committed:false, snapshot:snap(cur) });
        put(d, path, next); save(d); notify();
        return Promise.resolve({ committed:true, snapshot:snap(next) });
      },
      limitToLast(n){
        return { once(){
          const v = get(load(), path) || {};
          const o = {}; Object.keys(v).sort().slice(-n).forEach(k => o[k] = v[k]);
          return Promise.resolve(snap(o));
        } };
      }
    };
  }
  return { ref };
})();
function gameDb(){ return (firebaseReady && fbDb) ? fbDb : localGameDb; }
function gameRef(sub){ return gameDb().ref(GAME_PATH + (sub ? '/' + sub : '')); }

/* ---- market engine ----
   Each 30-minute step, a stock's move is the sum of:
   - random noise sized by its personality (vol)
   - a gentle pull back toward its base price (weak while a news trend is running)
   - the news trend: a drift in the story's direction worth ~1×vol per step, fading over ~3h,
     with the noise also calmed so the trend actually shows instead of drowning in randomness
   - supply & demand: net money that flowed in (buys) or out (sells) since the last step
   - theme stocks only: rare surprise jumps (not while a trend is running) */
const GAME_TREND_STEPS = 6;          // news after-effect length in moving 30-min steps (~3h)
const FLOW_DEPTH = 5000000;          // net 5,000,000원 of buying in one step ⇒ +10% (the cap)
const TREND_K = 0.6;                 // news drift per step as a share of the stock's own volatility (fades 20%/step)
const TREND_NOISE = 0.9;             // noise is only slightly calmed during a trend — so news usually, not always, plays out
function gaussRand(){ let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function clampPrice(stock, v){ return Math.max(10, Math.round(Math.max(stock.base * 0.1, v) / 10) * 10); }
function flowImpact(won){ return Math.max(-0.1, Math.min(0.1, (won || 0) / FLOW_DEPTH * 0.1)); }
function stepPrice(stock, price, trend, flowR){
  const drift = trend ? trend.d * trend.k * stock.vol : 0;
  const noise = gaussRand() * stock.vol * (trend ? TREND_NOISE : 1);
  const revert = ((stock.base - price) / stock.base) * (trend ? 0.004 : 0.02);
  let r = noise + drift + revert + (flowR || 0);
  if(stock.jump && !trend && Math.random() < 0.07) r += (Math.random() < 0.5 ? -1 : 1) * (0.08 + Math.random()*0.12);
  return clampPrice(stock, price * (1 + r));
}
function advanceMarket(m, target){
  if(!m || !m.prices){
    const prices = {}, history = {};
    GAME_STOCKS.forEach(s => { prices[s.id] = s.base; history[s.id] = [s.base]; });
    return { tick: target, prices, prev: Object.assign({}, prices), history, trend: {}, news: [], flow: {}, lastFlow: {} };
  }
  if(m.tick >= target) return undefined; // already current — abort the transaction, nothing to write
  const steps = Math.min(target - m.tick, GAME_HISTORY_LEN);
  let prices = Object.assign({}, m.prices), prev = Object.assign({}, m.prev || m.prices);
  const history = {};
  GAME_STOCKS.forEach(s => {
    if(!prices[s.id]) prices[s.id] = s.base;
    history[s.id] = (m.history && Array.isArray(m.history[s.id])) ? m.history[s.id].slice() : [prices[s.id]];
  });
  const trend = {};
  Object.keys(m.trend || {}).forEach(k => { const t = m.trend[k]; if(t && typeof t.d === 'number') trend[k] = Object.assign({}, t); });
  let news = Array.isArray(m.news) ? m.news.slice() : [];
  let flow = Object.assign({}, m.flow || {}), lastFlow = Object.assign({}, m.lastFlow || {});
  const base = target - steps;
  for(let i = 0; i < steps; i++){
    const tickNo = base + i + 1;
    if(isFrozenTick(tickNo)){
      // night: nothing moves (orders placed overnight are applied at 07:00). Flat point keeps the time axis honest.
      GAME_STOCKS.forEach(s => { history[s.id].push(prices[s.id]); if(history[s.id].length > GAME_HISTORY_LEN) history[s.id].shift(); });
      continue;
    }
    prev = prices;
    const next = {};
    GAME_STOCKS.forEach(s => { next[s.id] = stepPrice(s, prev[s.id], trend[s.id], flowImpact(flow[s.id])); });
    lastFlow = flow; flow = {};
    Object.keys(trend).forEach(k => { trend[k].left -= 1; trend[k].k *= 0.8; if(trend[k].left <= 0) delete trend[k]; });
    if(isNewsSlot(tickNo) && Math.random() < GAME_NEWS_PROB){
      const ev = makeNewsEvent(tickNo);
      ev.effects.forEach(ef => {
        const st = stockInfo(ef.stock);
        next[ef.stock] = clampPrice(st, next[ef.stock] * (1 + ef.shock));
        trend[ef.stock] = { d: ef.dir, k: ef.k, left: GAME_TREND_STEPS, n: ev.record.id };
      });
      news.push(ev.record);
      if(news.length > GAME_NEWS_KEEP) news = news.slice(-GAME_NEWS_KEEP);
    }
    GAME_STOCKS.forEach(s => {
      history[s.id].push(next[s.id]);
      if(history[s.id].length > GAME_HISTORY_LEN) history[s.id].shift();
    });
    prices = next;
  }
  return { tick: target, prices, prev, history, trend, news, flow, lastFlow };
}
async function ensureMarketCurrent(){
  const g = state.game, target = gameTickNow();
  if(g.market && g.market.tick >= target) return;
  if(g.advancing) return;
  g.advancing = true;
  try{ await withTimeout(gameRef('market').transaction(cur => advanceMarket(cur, target)), 8000, null); }catch(e){}
  g.advancing = false;
}

/* ---- player wallet ---- */
function playerDefaults(){
  return { cash: GAME_START_CASH, holdings:{}, cost:{}, items:{}, lastAllowance: todayStr(), daily:{ date: todayStr() }, joined: Date.now() };
}
function playerTotals(p, prices){
  p = p || {}; prices = prices || {};
  let stockValue = 0;
  Object.keys(p.holdings || {}).forEach(id => { stockValue += (p.holdings[id] || 0) * (prices[id] || 0); });
  return { cash: p.cash || 0, stockValue, total: (p.cash || 0) + stockValue };
}
async function claimDailyAllowance(){
  const id = state.currentUser; if(!id) return;
  let created = false, granted = false;
  const res = await withTimeout(gameRef('players/' + id).transaction(cur => {
    created = false; granted = false;
    if(!cur){ created = true; return playerDefaults(); }
    if(cur.lastAllowance !== todayStr()){
      cur.cash = (cur.cash || 0) + GAME_DAILY_CASH;
      cur.lastAllowance = todayStr();
      granted = true;
      return cur;
    }
    return undefined;
  }), 8000, null);
  if(res && res.committed){
    if(created) showToast('주식게임 시작! 시작 자금 ' + fmtWon(GAME_START_CASH) + '을 받았어요.');
    else if(granted) showToast('오늘의 지원금 ' + fmtWon(GAME_DAILY_CASH) + '을 받았어요.');
    gameLog({ type: created ? 'start' : 'allowance', amount: created ? GAME_START_CASH : GAME_DAILY_CASH });
  }
}
function gameLog(entry){
  try{ const r = gameRef('log').push(Object.assign({ uid: state.currentUser, at: Date.now() }, entry)); if(r && r.catch) r.catch(() => {}); }catch(e){}
}

/* ---- trading ---- */
// Big orders move the price against you while they fill (half of their own supply/demand impact).
// This also stops "buy a lot, let my own buying lift the price, sell" from being free money.
function execPrice(side, price, qty){
  const half = Math.abs(flowImpact(price * qty)) / 2;
  return Math.max(10, Math.round(price * (side === 'buy' ? 1 + half : 1 - half) / 10) * 10);
}
function recordFlow(stockId, won){
  try{ const r = gameRef('market/flow/' + stockId).transaction(cur => (cur || 0) + won); if(r && r.catch) r.catch(() => {}); }catch(e){}
}
async function gameTrade(side, stockId){
  const st = marketStatus();
  if(!st.open && side === 'buy'){ showToast('수업 시간에는 매수할 수 없어요 (매도는 가능해요). ' + st.reopen + '에 다시 열려요.', 'err'); return; }
  const g = state.game;
  if(!g.market || !g.market.prices || !g.playerLoaded){ showToast('시장 정보를 불러오는 중이에요.', 'err'); return; }
  if(g.market.tick < gameTickNow()) await ensureMarketCurrent();
  const price = g.market.prices[stockId];
  const qty = Math.floor(Number(g.qty[stockId] || 0));
  if(!(qty > 0)){ showToast('수량을 입력해주세요.', 'err'); return; }
  if(!(price > 0)){ showToast('시세를 확인할 수 없어요.', 'err'); return; }
  const fill = execPrice(side, price, qty);
  let err = '';
  const res = await withTimeout(gameRef('players/' + state.currentUser).transaction(cur => {
    err = '';
    if(!cur) cur = playerDefaults();
    cur.holdings = cur.holdings || {}; cur.cost = cur.cost || {};
    const have = cur.holdings[stockId] || 0;
    if(side === 'buy'){
      const total = fill * qty;
      if((cur.cash || 0) < total){ err = '현금이 부족해요.'; return undefined; }
      cur.cash -= total;
      cur.cost[stockId] = Math.round(((cur.cost[stockId] || 0) * have + total) / (have + qty));
      cur.holdings[stockId] = have + qty;
    } else {
      if(have < qty){ err = '보유한 수량보다 많이 팔 수 없어요.'; return undefined; }
      cur.cash = (cur.cash || 0) + fill * qty;
      cur.holdings[stockId] = have - qty;
      if(cur.holdings[stockId] === 0){
        delete cur.holdings[stockId]; delete cur.cost[stockId];
        Object.keys(cur.orders || {}).forEach(oid => {
          if(cur.orders[oid].stock === stockId){ delete cur.orders[oid]; cur.items = cur.items || {}; cur.items.autoOrder = (cur.items.autoOrder || 0) + 1; }
        });
      }
    }
    return cur;
  }), 8000, null);
  if(err){ showToast(err, 'err'); return; }
  if(!res || !res.committed){ showToast('거래하지 못했어요. 잠시 후 다시 시도해주세요.', 'err'); return; }
  g.qty[stockId] = '';
  recordFlow(stockId, (side === 'buy' ? 1 : -1) * fill * qty);
  gameLog({ type: side, stock: stockId, qty, price: fill });
  showToast(stockName(stockId) + ' ' + qty + '주 ' + (side === 'buy' ? '매수' : '매도') + ' 완료 · 체결가 ' + fmtWon(fill));
}
function gameSetMax(side, stockId){
  const g = state.game, price = g.market && g.market.prices ? g.market.prices[stockId] : 0, p = g.player || {};
  if(side === 'buy'){
    let q = price > 0 ? Math.floor((p.cash || 0) / price) : 0;
    while(q > 0 && execPrice('buy', price, q) * q > (p.cash || 0)) q = Math.max(0, Math.floor(q * 0.995) - (q < 200 ? 1 : 0)); // account for slippage
    g.qty[stockId] = q;
  } else g.qty[stockId] = (p.holdings || {})[stockId] || 0;
  render();
}

/* ---- items ---- */
async function gameBuyItem(itemId){
  const item = GAME_ITEMS.find(x => x.id === itemId); if(!item) return;
  let err = '', won = null;
  const res = await withTimeout(gameRef('players/' + state.currentUser).transaction(cur => {
    err = '';
    if(!cur) cur = playerDefaults();
    cur.items = cur.items || {};
    if(!cur.daily || cur.daily.date !== todayStr()) cur.daily = { date: todayStr() };
    const bought = cur.daily[itemId] || 0;
    if(bought >= item.dailyLimit){ err = item.name + '은(는) 하루에 ' + item.dailyLimit + '개까지만 살 수 있어요.'; return undefined; }
    if((cur.cash || 0) < item.price){ err = '현금이 부족해요.'; return undefined; }
    cur.cash -= item.price;
    cur.daily[itemId] = bought + 1;
    if(item.instant){
      won = drawLotto();          // re-drawn if Firebase retries; whatever commits is what's shown
      cur.cash += won.amount;
    } else {
      cur.items[itemId] = (cur.items[itemId] || 0) + 1;
    }
    return cur;
  }), 8000, null);
  if(err){ showToast(err, 'err'); return; }
  if(!res || !res.committed){ showToast('구매하지 못했어요. 잠시 후 다시 시도해주세요.', 'err'); return; }
  if(item.instant && won){
    gameLog({ type:'lotto', price: item.price, prize: won.amount, tier: won.tier });
    state.game.lottoResult = { tier: won.tier, label: won.label, amount: won.amount, at: Date.now() };
    render();
    return;
  }
  gameLog({ type:'item', item: itemId, price: item.price });
  showToast(item.name + '을(를) 샀어요.');
}
/* ---- auto stop-loss / take-profit orders ----
   Orders live in the player's own wallet node. There's no server to watch prices, so the
   owner's app checks them whenever the market updates — but it sells at the price of the
   30-minute step where the condition was FIRST met (read from the price history), so opening
   the app late never changes the outcome. A transaction makes sure each order runs once. */
function playerTxn(fn){ return withTimeout(gameRef('players/' + state.currentUser).transaction(fn), 8000, null); }
function findOrderTriggers(orders, m){
  const out = [];
  if(!orders || !m || !m.history) return out;
  Object.keys(orders).forEach(id => {
    const o = orders[id], arr = m.history[o.stock];
    if(!arr || !arr.length) return;
    const first = m.tick - (arr.length - 1);
    for(let t = Math.max((o.tick || 0) + 1, first); t <= m.tick; t++){
      const price = arr[arr.length - 1 - (m.tick - t)];
      if((o.kind === 'stop' && price <= o.trigger) || (o.kind === 'take' && price >= o.trigger)){ out.push({ id, price, tick: t }); break; }
    }
  });
  return out;
}
async function processAutoOrders(){
  const g = state.game, m = g.market, p = g.player;
  if(!state.currentUser || !m || !p || !p.orders || g.processingOrders) return;
  if(!findOrderTriggers(p.orders, m).length) return;
  g.processingOrders = true;
  const done = [];
  const res = await playerTxn(cur => {
    done.length = 0;
    if(!cur || !cur.orders) return undefined;
    const hits = findOrderTriggers(cur.orders, m);
    if(!hits.length) return undefined;
    cur.holdings = cur.holdings || {}; cur.cost = cur.cost || {}; cur.items = cur.items || {};
    hits.forEach(h => {
      const o = cur.orders[h.id]; delete cur.orders[h.id];
      const have = cur.holdings[o.stock] || 0, q = Math.min(o.qty, have);
      if(q <= 0){ cur.items.autoOrder = (cur.items.autoOrder || 0) + 1; done.push({ stock:o.stock, kind:o.kind, qty:0 }); return; }
      cur.cash = (cur.cash || 0) + h.price * q;
      cur.holdings[o.stock] = have - q;
      if(cur.holdings[o.stock] === 0){ delete cur.holdings[o.stock]; delete cur.cost[o.stock]; }
      done.push({ stock:o.stock, kind:o.kind, qty:q, price:h.price, tick:h.tick });
    });
    return cur;
  });
  g.processingOrders = false;
  if(res && res.committed){
    done.forEach(d => {
      if(d.qty > 0){
        recordFlow(d.stock, -d.price * d.qty);
        gameLog({ type:'auto', stock:d.stock, kind:d.kind, qty:d.qty, price:d.price, tick:d.tick });
        showToast('⚡ 자동 ' + (d.kind === 'stop' ? '손절' : '익절') + ': ' + stockName(d.stock) + ' ' + d.qty + '주를 ' + fmtWon(d.price) + '에 팔았어요.');
      } else {
        showToast(stockName(d.stock) + '을(를) 더 이상 갖고 있지 않아 예약이 취소됐어요. 예약권은 돌려드렸어요.');
      }
    });
  }
}
function openOrderForm(stockId){
  const g = state.game;
  g.orderForm = (g.orderForm && g.orderForm.stock === stockId) ? null : { stock: stockId, kind:'stop', trigger:'', qty:'' };
  render();
}
async function placeAutoOrder(stockId){
  const g = state.game, f = g.orderForm || {}, m = g.market, p = g.player || {};
  if(!m || !m.prices){ showToast('시장 정보를 불러오는 중이에요.', 'err'); return; }
  const now = m.prices[stockId], have = (p.holdings || {})[stockId] || 0;
  const kind = f.kind === 'take' ? 'take' : 'stop';
  const trigger = Math.round(Number(f.trigger || 0) / 10) * 10;
  const sellAll = !String(f.qty || '').trim(); // blank = "everything I hold", resolved against the real wallet at save time
  const qty = sellAll ? null : Math.floor(Number(f.qty));
  if(!(trigger > 0)){ showToast('가격을 입력해주세요.', 'err'); return; }
  if(kind === 'stop' && trigger >= now){ showToast('손절 가격은 지금 가격(' + fmtWon(now) + ')보다 낮아야 해요.', 'err'); return; }
  if(kind === 'take' && trigger <= now){ showToast('익절 가격은 지금 가격(' + fmtWon(now) + ')보다 높아야 해요.', 'err'); return; }
  if(!sellAll && (!(qty > 0) || qty > have)){ showToast('수량은 1주부터 보유한 ' + have + '주까지 정할 수 있어요.', 'err'); return; }
  let err = '', placedQty = 0;
  const res = await playerTxn(cur => {
    err = '';
    if(!cur || !cur.items || !(cur.items.autoOrder > 0)){ err = '예약권이 없어요. 상점에서 살 수 있어요.'; return undefined; }
    const held = (cur.holdings || {})[stockId] || 0, q = sellAll ? held : qty;
    if(!(q > 0) || q > held){ err = held ? '보유한 수량(' + held + '주)보다 많이 걸 수 없어요.' : '이 주식을 더 이상 갖고 있지 않아요.'; return undefined; }
    placedQty = q;
    cur.items.autoOrder -= 1;
    cur.orders = cur.orders || {};
    cur.orders['o' + Date.now().toString(36) + Math.random().toString(36).slice(2,6)] = { stock: stockId, kind, trigger, qty: q, tick: m.tick, at: Date.now() };
    return cur;
  });
  if(err){ showToast(err, 'err'); return; }
  if(!res || !res.committed){ showToast('예약하지 못했어요. 잠시 후 다시 시도해주세요.', 'err'); return; }
  gameLog({ type:'orderSet', stock: stockId, kind, trigger, qty: placedQty });
  g.orderForm = null;
  showToast(stockName(stockId) + ' ' + (kind === 'stop' ? '손절' : '익절') + ' 예약 완료 · ' + fmtWon(trigger) + (kind === 'stop' ? ' 이하' : ' 이상'));
}
async function cancelAutoOrder(orderId){
  let stock = '';
  const res = await playerTxn(cur => {
    if(!cur || !cur.orders || !cur.orders[orderId]) return undefined;
    stock = cur.orders[orderId].stock;
    delete cur.orders[orderId];
    cur.items = cur.items || {}; cur.items.autoOrder = (cur.items.autoOrder || 0) + 1;
    return cur;
  });
  if(res && res.committed){ gameLog({ type:'orderCancel', stock }); showToast('예약을 취소했어요. 예약권은 돌려드렸어요.'); }
}
async function refundLegacyItems(){
  let refund = 0;
  const res = await playerTxn(cur => {
    refund = 0;
    if(!cur || !cur.items) return undefined;
    Object.keys(LEGACY_ITEMS).forEach(k => {
      if(k in cur.items){ refund += (cur.items[k] || 0) * LEGACY_ITEMS[k].price; delete cur.items[k]; }
    });
    if(!refund) return undefined;
    cur.cash = (cur.cash || 0) + refund;
    return cur;
  });
  if(res && res.committed && refund){
    gameLog({ type:'refund', amount: refund });
    showToast('힌트 아이템이 사라져서, 안 쓴 힌트 값 ' + fmtWon(refund) + '을 돌려드렸어요.');
  }
}

/* ---- sync lifecycle ---- */
function renderGameSafe(){
  // don't wipe out a number someone is in the middle of typing
  const a = document.activeElement;
  if(a && a.classList && (a.classList.contains('game-qty') || a.classList.contains('order-input'))){ state.game.pendingRender = true; return; }
  render();
}
function stopGameSync(){
  const g = state.game;
  (g.refs || []).forEach(r => { try{ r.off(); }catch(e){} });
  if(g.timer) clearInterval(g.timer);
  state.game = freshGameState();
}
function startGameSync(){
  const g = state.game;
  if(!state.currentUser || g.syncedFor === state.currentUser) return;
  if(g.syncedFor) stopGameSync();
  const gg = state.game;
  gg.syncedFor = state.currentUser;
  const marketRef = gameRef('market');
  const playerRef = gameRef('players/' + state.currentUser);
  gg.refs = [marketRef, playerRef];
  marketRef.on('value', snap => {
    gg.market = snap.val(); gg.marketLoaded = true;
    const news = (gg.market && gg.market.news) || [], latest = news.length ? news[news.length-1] : null;
    if(latest && gg.lastNewsId !== null && latest.id !== gg.lastNewsId && state.view === 'game'){
      showToast('📰 새 뉴스: ' + latest.title);
    }
    gg.lastNewsId = latest ? latest.id : '';
    processAutoOrders();
    if(state.view === 'game'){
      if(gg.tab === 'news' && latest) lsSet('game-news-seen', false, latest.id);
      renderGameSafe();
    }
  });
  playerRef.on('value', snap => { gg.player = snap.val(); gg.playerLoaded = true; processAutoOrders(); if(state.view === 'game') renderGameSafe(); });
  ensureMarketCurrent().then(claimDailyAllowance).then(refundLegacyItems).then(processAutoOrders);
  gg.timer = setInterval(() => {
    if(state.view !== 'game') return;
    const key = gameTickNow() + '|' + todayStr() + '|' + JSON.stringify(marketStatus());
    if(key !== gg.statusKey){
      const dayChanged = gg.statusKey && gg.statusKey.split('|')[1] !== todayStr();
      gg.statusKey = key;
      ensureMarketCurrent();
      if(dayChanged) claimDailyAllowance();
      renderGameSafe();
    }
  }, 15000);
}
function freshGameState(){
  return { tab:'market', chartOpen:null, orderForm:null, lottoResult:null, processingOrders:false, lastNewsId:null, market:null, player:null, marketLoaded:false, playerLoaded:false, qty:{}, hint:null,
           ranking:null, log:null, syncedFor:null, refs:[], timer:null, statusKey:'', advancing:false };
}

/* ---- rendering ---- */
function gameSparkline(arr){
  if(!Array.isArray(arr) || arr.length < 2) return '';
  const w = 90, h = 28, min = Math.min.apply(null, arr), max = Math.max.apply(null, arr), rng = (max - min) || 1;
  const pts = arr.map((v,i) => (i/(arr.length-1)*w).toFixed(1) + ',' + (h - ((v-min)/rng)*(h-2) - 1).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function tickLabel(tickNo){
  const d = new Date(tickNo * GAME_TICK_MS);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function renderStockChart(s, m){
  const arr = (m.history || {})[s.id] || [];
  if(arr.length < 2) return `<div class="stock-chart"><p class="text-3 small">아직 그래프를 그릴 만큼 기록이 쌓이지 않았어요. 30분마다 한 칸씩 늘어나요.</p></div>`;
  const W = 320, H = 130, P = 6;
  const min = Math.min.apply(null, arr), max = Math.max.apply(null, arr), rng = (max - min) || 1;
  const x = i => P + i * (W - 2*P) / (arr.length - 1);
  const y = v => P + (H - 2*P) * (1 - (v - min) / rng);
  const line = arr.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = line + ` L ${x(arr.length-1).toFixed(1)} ${H - P} L ${x(0).toFixed(1)} ${H - P} Z`;
  const ch = changeInfo(arr[arr.length-1], arr[0]);
  // where each news story about this stock landed on the chart
  const marks = (m.news || []).map(n => ({ n, e: newsEffects(n).find(e => e.s === s.id) })).filter(x => x.e).map(({ n, e }) => {
    const idx = arr.length - 1 - (m.tick - n.tick);
    if(idx < 0 || idx >= arr.length) return '';
    return `<circle cx="${x(idx).toFixed(1)}" cy="${y(arr[idx]).toFixed(1)}" r="4.2" class="news-mark ${e.d > 0 ? 'up' : 'down'}"><title>${esc(n.title)}</title></circle>`;
  }).join('');
  const firstTick = m.tick - (arr.length - 1);
  return `
  <div class="stock-chart ${ch.cls}">
    <div class="chart-head">
      <span>최고 <b>${fmtWon(max)}</b></span><span>최저 <b>${fmtWon(min)}</b></span><span class="${ch.cls}">기간 ${ch.text}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
      <line x1="${P}" y1="${y(arr[0]).toFixed(1)}" x2="${W-P}" y2="${y(arr[0]).toFixed(1)}" class="chart-base"/>
      <path d="${area}" class="chart-area"/>
      <path d="${line}" class="chart-line"/>
      ${marks}
      <circle cx="${x(arr.length-1).toFixed(1)}" cy="${y(arr[arr.length-1]).toFixed(1)}" r="3.4" class="chart-now"/>
    </svg>
    <div class="chart-foot"><span>${tickLabel(firstTick)}</span><span>${marks ? '● 뉴스 발생 시점' : ''}</span><span>${tickLabel(m.tick)}</span></div>
  </div>`;
}
function changeInfo(now, before){
  if(!before || !now) return { cls:'flat', text:'0.00%' };
  const pct = (now - before) / before * 100;
  if(Math.abs(pct) < 0.005) return { cls:'flat', text:'0.00%' };
  return { cls: pct > 0 ? 'up' : 'down', text: (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(2) + '%' };
}
function fmtMan(won){ const a = Math.abs(won); return a >= 10000 ? (Math.round(a / 1000) / 10) + '만원' : Math.round(a).toLocaleString('ko-KR') + '원'; }
function flowLine(m, id){
  const now = (m.flow || {})[id] || 0;
  if(Math.abs(now) < 1000) return `<div class="flow-line flat">수급 · 이번 30분 거래 적음</div>`;
  const pct = flowImpact(now) * 100;
  return `<div class="flow-line ${now > 0 ? 'up' : 'down'}">수급 · 이번 30분 ${now > 0 ? '매수세 우세' : '매도세 우세'} ${now > 0 ? '+' : '−'}${fmtMan(now)}

}

    <div class="list-item"><div class="list-item-body">
      <div class="row-head"><span class="row-title" style="margin:0;">${esc(it.name)}</span><span class="badge">${fmtWon(it.price)}</span></div>
      <div class="row-sub">${esc(it.desc)}</div>
      ${it.id === 'lotto' ? `<div class="lotto-table">${LOTTO_PRIZES.map(pz => `<span>${esc(pz.label)} ${pz.amount ? fmtWon(pz.amount) : ''} <b>${(pz.p * 100).toFixed(1).replace(/\.0$/, '')}%</b></span>`).join('')}</div>` : ''}
      <div class="row-sub" style="margin-top:4px;">${it.instant ? '' : '보유 ' + owned + '장 · '}오늘 구매 ${bought}/${it.dailyLimit}</div>
      <div class="item-actions">
        <button type="button" class="btn btn-primary btn-sm" data-act="gameBuyItem" data-item="${it.id}" ${bought >= it.dailyLimit ? 'disabled' : ''}>${it.instant ? '사서 바로 긁기' : '구매'}</button>
        ${it.instant ? '' : '<span class="text-3 small">사용은 <b>내 주식</b> 탭에서 종목별로 해요</span>'}
      </div>
    </div></div>`;
  }).join('')}</div>`;
}
function renderGameRank(){
  const g = state.game;
  if(g.rankLoading) return `<p class="text-2">순위를 불러오는 중이에요…</p>`;
  if(!g.ranking) return `<p class="text-2">순위를 불러오지 못했어요. <button type="button" class="link-btn" data-act="gameTab" data-tab="rank">다시 시도</button></p>`;
  if(!g.ranking.length) return `<div class="empty-state">${icon('users')}<p>아직 참가한 사람이 없어요.</p></div>`;
  return `
  <div class="list">${g.ranking.map((r,i) => {
    const u = state.users[r.id];
    const medal = ['gold','silver','bronze'][i] || '';
    return `<div class="list-item rank-row ${medal} ${r.id === state.currentUser ? 'me' : ''}">
      <span class="rank-no">${medal ? ['🥇','🥈','🥉'][i] : i+1}</span>
      <span class="rank-name">${esc(u ? u.displayName : r.id)}</span>
      <span class="rank-total">${fmtWon(r.total)}</span>
    </div>`;
  }).join('')}</div>
  <p class="footnote">순위는 탭을 열 때마다 새로 계산돼요 · 현금 + 보유 주식 현재가 기준</p>`;
}
function describeLog(x){
  if(x.type === 'buy')  return esc(stockName(x.stock)) + ' ' + x.qty + '주 매수 · ' + fmtWon(x.price * x.qty);
  if(x.type === 'sell') return esc(stockName(x.stock)) + ' ' + x.qty + '주 매도 · ' + fmtWon(x.price * x.qty);
  const itemName = id => { const it = GAME_ITEMS.find(i => i.id === id) || LEGACY_ITEMS[id]; return esc(it ? it.name : id); };
  if(x.type === 'item') return itemName(x.item) + ' 구매 · ' + fmtWon(x.price);
  if(x.type === 'use') return itemName(x.item) + ' 사용';
  if(x.type === 'orderSet') return esc(stockName(x.stock)) + ' ' + (x.kind === 'stop' ? '손절' : '익절') + ' 예약 · ' + fmtWon(x.trigger) + (x.kind === 'stop' ? ' 이하 ' : ' 이상 ') + x.qty + '주';
  if(x.type === 'orderCancel') return esc(stockName(x.stock)) + ' 자동 매도 예약 취소';
  if(x.type === 'auto') return '⚡ 자동 ' + (x.kind === 'stop' ? '손절' : '익절') + ' · ' + esc(stockName(x.stock)) + ' ' + x.qty + '주 · ' + fmtWon(x.price * x.qty);
  if(x.type === 'refund') return '힌트 아이템 환불 · ' + fmtWon(x.amount);
  if(x.type === 'lotto') return '🎟️ 로또 · ' + (x.prize ? fmtWon(x.prize) + ' 당첨' : '꽝') + ' (구매 ' + fmtWon(x.price) + ')';
  if(x.type === 'start') return '게임 시작 · ' + fmtWon(x.amount);
  if(x.type === 'allowance') return '오늘의 지원금 · ' + fmtWon(x.amount);
  return esc(x.type);
}
function renderGameLog(){
  const g = state.game;
  if(g.logLoading) return `<p class="text-2">거래 내역을 불러오는 중이에요…</p>`;
  if(!g.log) return `<p class="text-2">거래 내역을 불러오지 못했어요. <button type="button" class="link-btn" data-act="gameTab" data-tab="log">다시 시도</button></p>`;
  if(!g.log.length) return `<div class="empty-state">${icon('copy')}<p>아직 거래 내역이 없어요.</p></div>`;
  return `<div class="list">${g.log.map(x => {
    const d = new Date(x.at || 0);
    const who = isAdmin() ? `<span class="badge badge-alt">${esc((state.users[x.uid] || {}).displayName || x.uid)}</span>` : '';
    return `<div class="list-item"><div class="list-item-body">
      <div class="row-head">${who}<span class="text-3 small">${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</span></div>
      <div class="row-sub">${describeLog(x)}</div>
    </div></div>`;
  }).join('')}</div>`;
}
function renderGameView(){
  startGameSync();
  const g = state.game, st = marketStatus();
  const tabs = [['market','시장'],['mine','내 주식'],['news','뉴스'],['shop','상점'],['rank','순위'],['log', isAdmin() ? '전체 거래내역' : '거래내역']];
  const head = `
  <div class="view-header">
    <h2>${icon('chart')} 주식게임</h2>
    <span class="market-pill ${!st.open ? 'closed' : st.night ? 'night' : 'open'}">${
      !st.open ? st.period + '교시 수업 중 · 매도만 가능'
      : st.night ? '밤 시세 휴식 · 07:00 재개'
      : st.dayKind === 'holiday' ? '휴일 · 거래 가능'
      : st.dayKind === 'weekend' ? '주말 · 거래 가능'
      : '거래 가능'}</span>
  </div>`;
  if(!g.marketLoaded || !g.playerLoaded || !g.market || !g.market.prices){
    return head + `<div class="empty-state">${icon('chart')}<p>시장 정보를 불러오는 중이에요…</p></div>`;
  }
  const t = playerTotals(g.player, g.market.prices);
  const ch = changeInfo(t.total, GAME_START_CASH);
  return head + `
  <div class="card wallet-card">
    <div class="wallet-total"><span class="text-3 small">총자산</span><b>${fmtWon(t.total)}</b><span class="pl ${ch.cls}">${ch.text}</span></div>
    <div class="wallet-split">
      <div><span class="text-3 small">현금</span><b>${fmtWon(t.cash)}</b></div>
      <div><span class="text-3 small">주식</span><b>${fmtWon(t.stockValue)}</b></div>
    </div>
    <p class="text-3 small wallet-note">시세는 30분마다 바뀌어요 · 다음 변동 ${nextTickLabel()} · 매일 첫 접속 때 지원금 ${fmtWon(GAME_DAILY_CASH)}</p>
  </div>
  <div class="game-tabs">${tabs.map(tb => `<button type="button" class="game-tab ${g.tab === tb[0] ? 'active' : ''}" data-act="gameTab" data-tab="${tb[0]}">${tb[1]}${tb[0] === 'news' && g.tab !== 'news' && hasUnreadNews() ? '<span class="tab-dot"></span>' : ''}</button>`).join('')}</div>
  ${g.tab === 'market' ? renderGameMarket() : ''}
  ${g.tab === 'mine' ? renderGameMine() : ''}
  ${g.tab === 'news' ? renderGameNews() : ''}
  ${g.tab === 'shop' ? renderGameShop() : ''}
  ${g.tab === 'rank' ? renderGameRank() : ''}
  ${g.tab === 'log' ? renderGameLog() : ''}
  `;
}
function gameSwitchTab(tab){
  state.game.tab = tab;
  if(tab === 'news'){ const id = latestNewsId(); if(id) lsSet('game-news-seen', false, id); }
  if(tab === 'rank') loadGameRanking();
  else if(tab === 'log') loadGameLog();
  else render();
}

state.game = freshGameState();
bindEvents();
init();
</script>
</body>
</html>
